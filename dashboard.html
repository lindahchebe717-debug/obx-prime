<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBX PRIME | Volatility 10 Index</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="logo">OBX PRIME</div>
        <div class="nav-links">
            <a href="#" class="active">Trade</a>
            <a href="positions.html">Positions</a>
            <a href="#">AI Signals</a>
            <button class="btn-deposit">Deposit</button>
        </div>
    </nav>

    <main class="trade-container">
        <div class="chart-panel">
            <div class="asset-header">
                <div>
                    <h3>Vol 10 (1s)</h3>
                    <span class="price-change">+1.13%</span>
                </div>
                <div class="price-display" id="currentPrice">9607.39</div>
            </div>
            <div id="chart" style="width:100%; height:400px;"></div>
        </div>

        <div class="control-panel">
            <div style="display:flex; background:var(--bg-main); border-radius:8px; padding:4px;">
                <button style="flex:1; background:var(--primary-purple); border:none; color:white; padding:8px; border-radius:6px;">AUTO</button>
                <button style="flex:1; background:transparent; border:none; color:var(--text-gray); padding:8px;">MANUAL</button>
            </div>

            <label style="color:var(--primary-purple); font-size:0.8rem; font-weight:600;">STAKE ($)</label>
            <input type="number" class="stake-input" value="10" id="stakeAmount">
            
            <div class="quick-stakes">
                <button class="stake-btn" onclick="setStake(1)">$1</button>
                <button class="stake-btn" onclick="setStake(5)">$5</button>
                <button class="stake-btn" onclick="setStake(10)">$10</button>
                <button class="stake-btn" onclick="setStake(25)">$25</button>
                <button class="stake-btn" onclick="setStake(50)">$50</button>
                <button class="stake-btn" onclick="setStake(100)">$100</button>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1rem;">
                <div style="background:var(--bg-main); padding:1rem; border-radius:8px; text-align:center;">
                    <div style="font-size:0.7rem; color:var(--text-gray);">TARGET PROFIT</div>
                    <div style="font-weight:700;">$200</div>
                </div>
                <div style="background:var(--bg-main); padding:1rem; border-radius:8px; text-align:center;">
                    <div style="font-size:0.7rem; color:var(--text-gray);">STOP LOSS</div>
                    <div style="font-weight:700;">$999</div>
                </div>
            </div>

            <div class="trade-buttons">
                <button class="btn-even" onclick="placeTrade('EVEN')">
                    EVEN
                    <span class="payout-tag">95.2% Payout</span>
                </button>
                <button class="btn-odd" onclick="placeTrade('ODD')">
                    ODD
                    <span class="payout-tag">95.2% Payout</span>
                </button>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://twvwwpywcmjdrocsfhya.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Chart Setup
        const chartContainer = document.getElementById('chart');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { background: { color: '#1a1b2e' }, textColor: '#9ca3af' },
            grid: { vertLines: { color: '#2d2f45' }, horzLines: { color: '#2d2f45' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            timeScale: { timeVisible: true, secondsVisible: true }
        });
        const lineSeries = chart.addLineSeries({ color: '#ffffff', lineWidth: 2 });
        
        let currentPrice = 9607.39;
        let lastTime = Math.floor(Date.now() / 1000);
        
        function updateChart() {
            const change = (Math.random() - 0.5) * 5;
            currentPrice += change;
            lastTime += 1;
            lineSeries.update({ time: lastTime, value: currentPrice });
            document.getElementById('currentPrice').innerText = currentPrice.toFixed(2);
        }
        for(let i=0; i<60; i++) updateChart();
        setInterval(updateChart, 1000);

        function setStake(val) { document.getElementById('stakeAmount').value = val; }

        async function placeTrade(direction) {
            const stake = parseFloat(document.getElementById('stakeAmount').value);
            const entryPrice = currentPrice;
            
            const { data: { user } } = await supabase.auth.getUser();
            if(!user) return alert("Please login first via index.html");

            const { error } = await supabase.from('trades').insert({
                user_id: user.id, asset: 'VOL_10', direction: direction, 
                stake: stake, entry_price: entryPrice, status: 'OPEN'
            });

            if(error) console.error(error);
            else alert(`${direction} trade placed at ${entryPrice.toFixed(2)}!`);
        }

        supabase.channel('public:trades')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'trades' }, payload => {
                console.log('New trade detected:', payload.new);
            })
            .subscribe();
    </script>
</body>
</html>
