<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBX PRIME | Trade</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Keep all your existing styles exactly as they are */
        .icon-btn { background: none; border: none; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; }
        .icon-btn svg { width: 22px; height: 22px; stroke: var(--text-white); stroke-width: 2; fill: none; }
        .menu-icon { margin-right: -8px; } 
        .p-logo { width: 32px; height: 32px; background: var(--primary-purple); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1rem; margin-left: 8px; }
        .bell-icon { position: relative; }
        .bell-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: var(--danger-red); border-radius: 50%; border: 2px solid var(--bg-main); }
        .sound-btn svg { stroke: var(--primary-purple); }
        .stake-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .stake-adjust-btn { width: 40px; height: 40px; border-radius: 10px; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-gray); font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .stake-box { flex: 1; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px 16px; text-align: center; position: relative; }
        .stake-label { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--bg-card); padding: 0 8px; color: var(--primary-purple); font-size: 0.65rem; font-weight: 800; letter-spacing: 1px; }
        .stake-input { background: transparent; border: none; color: white; font-size: 1.6rem; font-weight: 800; text-align: center; width: 100%; outline: none; }
        .stake-currency { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--primary-purple); font-weight: 700; font-size: 1rem; }
        .quick-stakes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px; }
        .qs-btn { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-gray); padding: 8px 0; border-radius: 8px; font-size: 0.7rem; font-weight: 600; cursor: pointer; }
        .live-stats-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(26, 27, 46, 0.8); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
        .live-left { display: flex; align-items: center; gap: 8px; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .live-label { font-size: 0.7rem; font-weight: 800; color: #f59e0b; letter-spacing: 0.5px; }
        .live-stats { font-size: 0.7rem; color: var(--text-gray); font-weight: 600; }
        .live-pnl { font-size: 0.85rem; font-weight: 800; }
        .live-pnl.positive { color: var(--success-green); }
        .digit-row { display: flex; justify-content: space-between; padding: 8px 16px 12px; gap: 2px; background: var(--bg-main); }
        .digit-circle { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
        .circle-container { width: 32px; height: 32px; position: relative; display: flex; align-items: center; justify-content: center; }
        .digit-num { position: absolute; font-weight: 800; font-size: 0.8rem; color: white; z-index: 2; }
        .digit-pct { font-size: 0.55rem; color: var(--text-gray); font-weight: 500; }
        .trade-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-trade { border: none; padding: 14px 10px; border-radius: 14px; color: white; font-size: 1rem; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .btn-even { background: var(--success-green); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-odd { background: var(--danger-red); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .payout-info { font-size: 0.6rem; font-weight: 500; opacity: 0.9; }
        .current-price-lg { font-size: 1.3rem; font-weight: 800; margin-top: 2px; letter-spacing: -0.5px; }
        .asset-name { font-size: 0.85rem; font-weight: 700; }
        .mode-toggle { display: flex; background: var(--bg-main); border-radius: 10px; padding: 3px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .mode-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.75rem; cursor: pointer; background: transparent; color: var(--text-gray); letter-spacing: 0.5px; }
        .mode-btn.active { background: var(--primary-purple); color: white; }

        /* FIXED: Smaller bottom nav to save space for buttons */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            height: 60px; /* Reduced from 70px */
            background: var(--bg-card); 
            border-top: 1px solid var(--border-color); 
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 100; padding-bottom: env(safe-area-inset-bottom); 
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-gray); text-decoration: none; font-size: 0.6rem; font-weight: 600; flex: 1; height: 100%; justify-content: center; transition: color 0.2s; }
        .nav-item.active { color: var(--primary-purple); }
        .nav-icon { width: 20px; height: 20px; } /* Smaller icons */
        .ai-icon-wrap { width: 36px; height: 36px; } /* Smaller AI button */
        .ai-icon { width: 18px; height: 18px; }

        /* Chart & Axis Styles */
        #chartCanvas { width: 100%; height: 100%; display: block; }
        .chart-wrapper { 
            position: relative; 
            height: 180px; 
            padding: 0 16px; 
            background: var(--bg-main); 
            overflow: hidden; 
            flex-shrink: 0; 
        }
        .axis-labels-right { position: absolute; right: 16px; top: 0; bottom: 30px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; z-index: 5; }
        .axis-label-r { font-size: 0.65rem; color: var(--text-gray); text-align: right; width: 50px; }
        .axis-labels-bottom { position: absolute; left: 16px; right: 60px; bottom: 0; display: flex; justify-content: space-between; pointer-events: none; z-index: 5; }
        .axis-label-b { font-size: 0.65rem; color: var(--text-gray); }

        /* FIXED: Reduced padding since nav is smaller */
        .controls-panel { padding-bottom: 90px; } 
        
        /* FIXED: Compact tabs */
        .asset-tabs { 
            display: flex; gap: 6px; padding: 0 12px 10px; 
            overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; align-items: center; 
        }
        .asset-tabs::-webkit-scrollbar { display: none; }
        .asset-tab { 
            background: transparent; border: 1px solid var(--border-color); color: var(--text-gray); 
            padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; 
            white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 5px;
            transition: all 0.2s; flex-shrink: 0;
        }
        .asset-tab svg { width: 12px; height: 12px; fill: currentColor; opacity: 0.7; }
        .asset-tab.active { 
            background: rgba(139, 92, 246, 0.15); border-color: var(--primary-purple);
            color: var(--text-white); font-weight: 600;
        }
        .asset-tab.active svg { opacity: 1; fill: var(--primary-purple); }
    </style>
</head>
<body>
    <!-- Top Header -->
    <header class="top-header">
        <button class="icon-btn menu-icon"><svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="p-logo">P</div>
        <div style="display:flex; align-items:center; gap:8px;">
            <div class="user-balance"><span style="color:var(--primary-purple); font-weight:800; font-size:0.8rem;">R</span> <span style="font-size:0.85rem;">$0.00</span></div>
            <button class="icon-btn sound-btn"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg></button>
            <button class="btn-deposit" style="padding:6px 14px; font-size:0.8rem;">Deposit</button>
            <button class="icon-btn bell-icon"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><div class="bell-dot"></div></button>
        </div>
    </header>

    <!-- Asset Tabs (Scrollable) -->
    <div class="asset-tabs">
        <button class="asset-tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3" stroke="currentColor" stroke-width="2" fill="none"/></svg> Matches/Differs</button>
        <button class="asset-tab active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Even/Odd</button>
        <button class="asset-tab"><svg viewBox="0 0 24 24"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4" stroke="currentColor" stroke-width="2" fill="none"/></svg> Over/Under</button>
    </div>

    <!-- Main Chart Area -->
    <div class="chart-wrapper">
        <div class="price-overlay">
            <div class="asset-name"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--primary-purple)" stroke-width="2.5"><path d="M12 20V10M18 20V4M6 20v-4"/></svg> Vol 10 (1s)</div>
            <div class="current-price-lg" id="currentPrice">9607.39</div>
            <div style="font-size:0.65rem; color:var(--success-green); margin-top:2px; font-weight:600;">+1.13%</div>
        </div>
        
        <canvas id="chartCanvas"></canvas>
        
        <div class="axis-labels-right" id="axisLabelsRight">
            <div class="axis-label-r">--</div>
            <div class="axis-label-r">--</div>
            <div class="axis-label-r">--</div>
            <div class="axis-label-r">--</div>
            <div class="axis-label-r">--</div>
        </div>
        <div class="axis-labels-bottom">
            <div class="axis-label-b">--:--:--</div>
            <div class="axis-label-b">--:--:--</div>
            <div class="axis-label-b">--:--:--</div>
            <div class="axis-label-b">--:--:--</div>
            <div class="axis-label-b">--:--:--</div>
        </div>
    </div>

    <!-- Digit Frequency Row -->
    <div class="digit-row" id="digitRow"></div>

    <!-- Trading Controls -->
    <div class="controls-panel">
        <div class="mode-toggle">
            <button class="mode-btn active">AUTO</button>
            <button class="mode-btn">MANUAL</button>
        </div>
        <div class="stake-wrapper">
            <button class="stake-adjust-btn" onclick="adjustStake(-1)">−</button>
            <div class="stake-box">
                <div class="stake-label">STAKE</div>
                <span class="stake-currency">$</span>
                <input type="number" class="stake-input" value="10" id="stakeAmount">
            </div>
            <button class="stake-adjust-btn" onclick="adjustStake(1)">+</button>
        </div>
        <div class="quick-stakes">
            <button class="qs-btn" onclick="setStake(1)">$1</button><button class="qs-btn" onclick="setStake(5)">$5</button>
            <button class="qs-btn" onclick="setStake(10)">$10</button><button class="qs-btn" onclick="setStake(25)">$25</button>
            <button class="qs-btn" onclick="setStake(50)">$50</button><button class="qs-btn" onclick="setStake(100)">$100</button>
        </div>
        <div class="live-stats-bar">
            <div class="live-left"><div class="live-dot"></div><span class="live-label">LIVE</span><span class="live-stats" id="liveStatsText">0T · 0W · 0L</span></div>
            <div class="live-pnl positive" id="livePnl">+$0.00</div>
        </div>
        <div class="trade-actions">
            <button class="btn-trade btn-even" onclick="placeTrade('EVEN')">Even<span class="payout-info">95.2% Payout</span></button>
            <button class="btn-trade btn-odd" onclick="placeTrade('ODD')">Odd<span class="payout-info">95.2% Payout</span></button>
        </div>
    </div>

    <!-- Bottom Navigation Bar (SMALLER) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h2v8H3zm6-4h2v12H9zm6-4h2v16h-2zm6-4h2v20h-2z"/></svg>Trade</a>
        <a href="#" class="nav-item ai-btn"><div class="ai-icon-wrap"><svg class="ai-icon" viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg></div>AI</a>
        <a href="positions.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>Positions</a>
    </nav>

    <script>
        // --- SUPABASE INIT ---
        const OBX_SUPABASE_URL = 'https://twvwwpywcmjdrocsfhya.supabase.co';
        const OBX_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8';
        let obxSupabase;
        if (typeof window.supabase !== 'undefined') obxSupabase = window.supabase.createClient(OBX_SUPABASE_URL, OBX_SUPABASE_ANON_KEY);

        // --- DIGIT FREQUENCY ---
        const digitCounts = new Array(10).fill(0);
        let totalDigits = 0;
        const RADIUS = 14;
        const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

        function initDigitRow() {
            const row = document.getElementById('digitRow');
            if (!row) return;
            row.innerHTML = '';
            for(let i=0; i<=9; i++) {
                row.innerHTML += `
                    <div class="digit-circle">
                        <div class="circle-container">
                            <svg width="32" height="32" viewBox="0 0 32 32">
                                <circle cx="16" cy="16" r="${RADIUS}" stroke="#2d2f45" stroke-width="2.5" fill="none"/>
                                <circle id="prog-${i}" cx="16" cy="16" r="${RADIUS}" stroke="var(--text-gray)" stroke-width="2.5" fill="none" stroke-dasharray="${CIRCUMFERENCE}" stroke-dashoffset="${CIRCUMFERENCE}" transform="rotate(-90 16 16)"/>
                            </svg>
                            <div class="digit-num">${i}</div>
                        </div>
                        <div class="digit-pct" id="pct-${i}">0%</div>
                    </div>`;
            }
        }

        function updateDigitStats(price) {
            const lastDigit = Math.floor(price) % 10;
            digitCounts[lastDigit]++;
            totalDigits++;
            for(let i=0; i<=9; i++) {
                const pct = totalDigits > 0 ? (digitCounts[i] / totalDigits) * 100 : 0;
                const offset = CIRCUMFERENCE - (pct / 100) * CIRCUMFERENCE;
                const pctEl = document.getElementById(`pct-${i}`);
                const progCircle = document.getElementById(`prog-${i}`);
                if(pctEl) pctEl.innerText = pct.toFixed(1) + '%';
                if(progCircle) {
                    progCircle.style.strokeDashoffset = offset;
                    progCircle.style.stroke = pct >= 10 ? 'var(--success-green)' : 'var(--danger-red)';
                }
            }
        }
        initDigitRow();

        // --- MOVING CHART ENGINE ---
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        let priceData = [];
        let timeData = [];
        let currentPrice = 9607.39;
        const MAX_POINTS = 60; 

        function resizeCanvas() {
            if (!canvas) return;
            const parent = canvas.parentElement;
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
            drawChart();
        }

        function formatTime(timestamp) {
            const d = new Date(timestamp * 1000);
            return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
        }

        function drawChart() {
            if (!ctx || !canvas.width) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Grid Lines
            ctx.strokeStyle = 'rgba(45, 47, 69, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=1; i<5; i++) {
                let y = (canvas.height / 5) * i;
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            }
            for(let i=1; i<5; i++) {
                let x = (canvas.width / 5) * i;
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
            }
            ctx.stroke();

            if (priceData.length === 0) return;
            
            let min = Math.min(...priceData);
            let max = Math.max(...priceData);
            let range = max - min || 1;
            let padding = range * 0.2;
            min -= padding; max += padding; range = max - min;

            // Draw Line
            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            const stepX = canvas.width / (MAX_POINTS - 1);
            
            priceData.forEach((price, i) => {
                const x = i * stepX;
                const y = canvas.height - ((price - min) / range) * canvas.height;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Pulsing Dot at End
            const lastIdx = priceData.length - 1;
            const lastX = lastIdx * stepX;
            const lastY = canvas.height - ((priceData[lastIdx] - min) / range) * canvas.height;
            
            ctx.beginPath();
            ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(lastX, lastY, 8, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fill();

            // Gradient Fill
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, 'rgba(139, 92, 246, 0.2)');
            gradient.addColorStop(1, 'rgba(139, 92, 246, 0)');
            ctx.fillStyle = gradient;
            ctx.fill();

            // Update Dynamic Axis Labels
            const rightLabels = document.getElementById('axisLabelsRight');
            if(rightLabels) {
                const labels = rightLabels.querySelectorAll('.axis-label-r');
                for(let i=0; i<labels.length; i++) {
                    const yPos = (canvas.height / 5) * (labels.length - i);
                    const priceAtLevel = min + ((canvas.height - yPos) / canvas.height) * range;
                    labels[i].innerText = priceAtLevel.toFixed(2);
                }
            }

            // Update Bottom Time Labels based on actual data
            const bottomLabels = document.querySelector('.axis-labels-bottom');
            if(bottomLabels && timeData.length > 0) {
                const labels = bottomLabels.querySelectorAll('.axis-label-b');
                const step = Math.floor(timeData.length / 5);
                for(let i=0; i<labels.length; i++) {
                    const idx = Math.min(i * step, timeData.length - 1);
                    labels[i].innerText = formatTime(timeData[idx]);
                }
            }
        }

        function updateChart() {
            const change = (Math.random() - 0.5) * 3;
            currentPrice += change;
            const now = Math.floor(Date.now() / 1000);
            
            priceData.push(currentPrice);
            timeData.push(now);
            
            // SLIDING WINDOW: Remove oldest point when we exceed MAX_POINTS
            if (priceData.length > MAX_POINTS) {
                priceData.shift();
                timeData.shift();
            }
            
            const priceEl = document.getElementById('currentPrice');
            if(priceEl) priceEl.innerText = currentPrice.toFixed(2);
            
            updateDigitStats(currentPrice);
            drawChart();
        }

        // Initialize with MAX_POINTS so chart is full immediately
        for(let i=0; i<MAX_POINTS; i++) updateChart();
        setInterval(updateChart, 1000);
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        // --- TRADING FUNCTIONS ---
        let stats = { total: 0, wins: 0, losses: 0, pnl: 0 };
        function setStake(val) { 
            const el = document.getElementById('stakeAmount');
            if(el) el.value = val; 
        }
        function adjustStake(delta) {
            const input = document.getElementById('stakeAmount');
            if(!input) return;
            let val = parseInt(input.value) || 0;
            input.value = Math.max(1, val + delta);
        }

        async function placeTrade(direction) {
            if (!obxSupabase) return alert("System error: Supabase not loaded.");
            const stakeInput = document.getElementById('stakeAmount');
            const stake = parseFloat(stakeInput ? stakeInput.value : 10);
            const entryPrice = currentPrice;
            
            try {
                const { data: { user } } = await obxSupabase.auth.getUser();
                if(!user) return alert("Please login first via index.html");

                const { error } = await obxSupabase.from('trades').insert({
                    user_id: user.id, asset: 'VOL_10', direction: direction, 
                    stake: stake, entry_price: entryPrice, status: 'OPEN'
                });

                if(error) console.error(error);
                else {
                    stats.total++;
                    const won = Math.random() > 0.5;
                    if(won) { stats.wins++; stats.pnl += stake * 0.952; } 
                    else { stats.losses++; stats.pnl -= stake; }
                    
                    const statsText = document.getElementById('liveStatsText');
                    const pnlEl = document.getElementById('livePnl');
                    
                    if(statsText) statsText.innerText = `${stats.total}T · ${stats.wins}W · ${stats.losses}L`;
                    if(pnlEl) {
                        const sign = stats.pnl >= 0 ? '+' : '';
                        pnlEl.innerText = `${sign}$${Math.abs(stats.pnl).toFixed(2)}`;
                        pnlEl.className = `live-pnl ${stats.pnl >= 0 ? 'positive' : 'negative'}`;
                    }
                    if(navigator.vibrate) navigator.vibrate(50);
                }
            } catch(e) {
                console.error("Trade error:", e);
            }
        }
    </script>
</body>
</html>
