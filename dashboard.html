<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBX PRIME | Trade</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Updated styles for smaller fonts, +/- buttons, and LIVE stats bar -->
    <style>
        .icon-btn { background: none; border: none; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; }
        .icon-btn svg { width: 22px; height: 22px; stroke: var(--text-white); stroke-width: 2; fill: none; }
        .menu-icon { margin-right: -8px; } 
        
        /* P Logo */
        .p-logo { 
            width: 32px; height: 32px; 
            background: var(--primary-purple); 
            color: white; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; font-size: 1rem; 
            margin-left: 8px;
        }

        /* Bell Icon */
        .bell-icon { position: relative; }
        .bell-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: var(--danger-red); border-radius: 50%; border: 2px solid var(--bg-main); }
        
        /* Sound Icon */
        .sound-btn svg { stroke: var(--primary-purple); }

        /* Stake Box with +/- Buttons */
        .stake-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .stake-adjust-btn { 
            width: 40px; height: 40px; border-radius: 10px; 
            background: var(--bg-main); border: 1px solid var(--border-color); 
            color: var(--text-gray); font-size: 1.2rem; font-weight: 600;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .stake-adjust-btn:active { background: rgba(139, 92, 246, 0.2); color: white; }
        
        .stake-box { 
            flex: 1; background: var(--bg-main); border: 1px solid var(--border-color); 
            border-radius: 16px; padding: 12px 16px; text-align: center; position: relative; 
        }
        .stake-label { 
            position: absolute; top: -9px; left: 50%; transform: translateX(-50%); 
            background: var(--bg-card); padding: 0 8px; 
            color: var(--primary-purple); font-size: 0.65rem; font-weight: 800; letter-spacing: 1px; 
        }
        .stake-input { background: transparent; border: none; color: white; font-size: 1.6rem; font-weight: 800; text-align: center; width: 100%; outline: none; }
        .stake-currency { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--primary-purple); font-weight: 700; font-size: 1rem; }

        /* Quick Stakes - Smaller */
        .quick-stakes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px; }
        .qs-btn { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-gray); padding: 8px 0; border-radius: 8px; font-size: 0.7rem; font-weight: 600; cursor: pointer; }
        .qs-btn:hover, .qs-btn:active { border-color: var(--primary-purple); color: white; background: rgba(139, 92, 246, 0.1); }

        /* LIVE Stats Bar */
        .live-stats-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(26, 27, 46, 0.8); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
        }
        .live-left { display: flex; align-items: center; gap: 8px; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .live-label { font-size: 0.7rem; font-weight: 800; color: #f59e0b; letter-spacing: 0.5px; }
        .live-stats { font-size: 0.7rem; color: var(--text-gray); font-weight: 600; }
        .live-pnl { font-size: 0.85rem; font-weight: 800; }
        .live-pnl.positive { color: var(--success-green); }
        .live-pnl.negative { color: var(--danger-red); }

        /* Digit Row - Smaller circles */
        .digit-row { display: flex; justify-content: space-between; padding: 8px 16px 12px; gap: 2px; background: var(--bg-main); }
        .digit-circle { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
        .circle-container { width: 32px; height: 32px; position: relative; display: flex; align-items: center; justify-content: center; }
        .digit-num { position: absolute; font-weight: 800; font-size: 0.8rem; color: white; z-index: 2; }
        .digit-pct { font-size: 0.55rem; color: var(--text-gray); font-weight: 500; }

        /* Trade Buttons - Smaller */
        .trade-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-trade { border: none; padding: 14px 10px; border-radius: 14px; color: white; font-size: 1rem; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .btn-even { background: var(--success-green); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-odd { background: var(--danger-red); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .payout-info { font-size: 0.6rem; font-weight: 500; opacity: 0.9; }

        /* Price Overlay - Smaller */
        .current-price-lg { font-size: 1.3rem; font-weight: 800; margin-top: 2px; letter-spacing: -0.5px; }
        .asset-name { font-size: 0.85rem; font-weight: 700; }

        /* Mode Toggle - Smaller */
        .mode-toggle { display: flex; background: var(--bg-main); border-radius: 10px; padding: 3px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .mode-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.75rem; cursor: pointer; background: transparent; color: var(--text-gray); letter-spacing: 0.5px; }
        .mode-btn.active { background: var(--primary-purple); color: white; }

        /* Bottom Nav - Smaller */
        .nav-item { font-size: 0.65rem; }
        .nav-icon { width: 22px; height: 22px; }
        .ai-icon-wrap { width: 40px; height: 40px; }
        .ai-icon { width: 20px; height: 20px; }
    </style>
</head>
<body>
    <!-- Top Header -->
    <header class="top-header">
        <button class="icon-btn menu-icon">
            <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="p-logo">P</div>

        <div style="display:flex; align-items:center; gap:8px;">
            <div class="user-balance">
                <span style="color:var(--primary-purple); font-weight:800; font-size:0.8rem;">R</span> 
                <span style="font-size:0.85rem;">$0.00</span>
            </div>
            
            <button class="icon-btn sound-btn">
                <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            </button>

            <button class="btn-deposit" style="padding:6px 14px; font-size:0.8rem;">Deposit</button>
            
            <button class="icon-btn bell-icon">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <div class="bell-dot"></div>
            </button>
        </div>
    </header>

    <!-- Asset Selection Tabs -->
    <div class="asset-tabs">
        <button class="asset-tab">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3" stroke="currentColor" stroke-width="2" fill="none"/></svg>
            Matches/Differs
        </button>
        <button class="asset-tab active">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Even/Odd
        </button>
        <button class="asset-tab">
            <svg viewBox="0 0 24 24"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
            Over/Under
        </button>
    </div>

    <!-- Main Chart Area -->
    <div class="chart-wrapper">
        <div class="price-overlay">
            <div class="asset-name">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--primary-purple)" stroke-width="2.5"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
                Vol 10 (1s)
            </div>
            <div class="current-price-lg" id="currentPrice">9607.39</div>
            <div style="font-size:0.65rem; color:var(--success-green); margin-top:2px; font-weight:600;">+1.13%</div>
        </div>
        <div id="chart"></div>
    </div>

    <!-- Digit Frequency Row -->
    <div class="digit-row" id="digitRow"></div>

    <!-- Trading Controls -->
    <div class="controls-panel">
        <div class="mode-toggle">
            <button class="mode-btn active">AUTO</button>
            <button class="mode-btn">MANUAL</button>
        </div>

        <!-- Stake with +/- Buttons -->
        <div class="stake-wrapper">
            <button class="stake-adjust-btn" onclick="adjustStake(-1)">−</button>
            <div class="stake-box">
                <div class="stake-label">STAKE</div>
                <span class="stake-currency">$</span>
                <input type="number" class="stake-input" value="10" id="stakeAmount">
            </div>
            <button class="stake-adjust-btn" onclick="adjustStake(1)">+</button>
        </div>

        <!-- Quick Stakes -->
        <div class="quick-stakes">
            <button class="qs-btn" onclick="setStake(1)">$1</button>
            <button class="qs-btn" onclick="setStake(5)">$5</button>
            <button class="qs-btn" onclick="setStake(10)">$10</button>
            <button class="qs-btn" onclick="setStake(25)">$25</button>
            <button class="qs-btn" onclick="setStake(50)">$50</button>
            <button class="qs-btn" onclick="setStake(100)">$100</button>
        </div>

        <!-- LIVE Stats Bar -->
        <div class="live-stats-bar">
            <div class="live-left">
                <div class="live-dot"></div>
                <span class="live-label">LIVE</span>
                <span class="live-stats" id="liveStatsText">0T · 0W · 0L</span>
            </div>
            <div class="live-pnl positive" id="livePnl">+$0.00</div>
        </div>

        <!-- Trade Actions -->
        <div class="trade-actions">
            <button class="btn-trade btn-even" onclick="placeTrade('EVEN')">
                Even
                <span class="payout-info">95.2% Payout</span>
            </button>
            <button class="btn-trade btn-odd" onclick="placeTrade('ODD')">
                Odd
                <span class="payout-info">95.2% Payout</span>
            </button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h2v8H3zm6-4h2v12H9zm6-4h2v16h-2zm6-4h2v20h-2z"/></svg>
            Trade
        </a>
        <a href="#" class="nav-item ai-btn">
            <div class="ai-icon-wrap">
                <svg class="ai-icon" viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg>
            </div>
            AI
        </a>
        <a href="positions.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            Positions
        </a>
    </nav>

    <script>
        // --- SUPABASE INIT ---
        const OBX_SUPABASE_URL = 'https://twvwwpywcmjdrocsfhya.supabase.co';
        const OBX_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8';
        
        let obxSupabase;
        if (typeof window.supabase !== 'undefined') {
            obxSupabase = window.supabase.createClient(OBX_SUPABASE_URL, OBX_SUPABASE_ANON_KEY);
        }

        // --- CHART SETUP (EXACT PALOPTION STYLE) ---
        const chartContainer = document.getElementById('chart');
        
        // Initialize chart with Grid Lines and Axes enabled
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { 
                background: { color: 'transparent' }, 
                textColor: '#9ca3af',
                fontFamily: 'Inter, sans-serif',
                fontSize: 10
            },
            // Enable Grid Lines exactly like screenshot
            grid: { 
                vertLines: { visible: true, color: 'rgba(45, 47, 69, 0.4)', style: 1 }, 
                horzLines: { visible: true, color: 'rgba(45, 47, 69, 0.4)', style: 1 } 
            },
            crosshair: { 
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: { color: '#8b5cf6', width: 1, style: 3, labelBackgroundColor: '#8b5cf6' },
                horzLine: { color: '#8b5cf6', width: 1, style: 3, labelBackgroundColor: '#8b5cf6' }
            },
            // Time Axis (Bottom) - Shows Real Time
            timeScale: { 
                visible: true, 
                secondsVisible: true, 
                timeVisible: true,
                borderColor: '#2d2f45',
                rightOffset: 5,
                barSpacing: 10
            },
            // Price Axis (Right Side) - Shows Exact Numbers
            rightPriceScale: { 
                visible: true, 
                borderColor: '#2d2f45',
                scaleMargins: { top: 0.1, bottom: 0.1 }
            },
            handleScroll: { vertTouchDrag: false }
        });
        
        const lineSeries = chart.addLineSeries({ 
            color: '#ffffff', 
            lineWidth: 2,
            crosshairMarkerRadius: 5,
            crosshairMarkerBackgroundColor: '#fff',
            crosshairMarkerBorderColor: '#8b5cf6',
            crosshairMarkerBorderWidth: 2,
            priceLineVisible: false // Hide default price line to use our custom overlay
        });

        let currentPrice = 9607.39;
        let lastTime = Math.floor(Date.now() / 1000);
        
        function updateChart() {
            const change = (Math.random() - 0.5) * 3;
            currentPrice += change;
            lastTime += 1;
            lineSeries.update({ time: lastTime, value: currentPrice });
            document.getElementById('currentPrice').innerText = currentPrice.toFixed(2);
            updateDigitStats(currentPrice);
        }

        // Fill initial data so chart isn't empty
        for(let i=0; i<100; i++) updateChart();
        setInterval(updateChart, 1000);

        // Handle Resize
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });

        // --- DIGIT FREQUENCY ---
        const digitCounts = new Array(10).fill(0);
        let totalDigits = 0;
        const CIRCUMFERENCE = 2 * Math.PI * 14;

        function initDigitRow() {
            const row = document.getElementById('digitRow');
            row.innerHTML = '';
            for(let i=0; i<=9; i++) {
                row.innerHTML += `
                    <div class="digit-circle">
                        <div class="circle-container">
                            <svg width="32" height="32" viewBox="0 0 32 32">
                                <circle cx="16" cy="16" r="14" stroke="#2d2f45" stroke-width="2.5" fill="none"/>
                                <circle id="prog-${i}" cx="16" cy="16" r="14" 
                                    stroke="var(--text-gray)" stroke-width="2.5" fill="none"
                                    stroke-dasharray="${CIRCUMFERENCE}" 
                                    stroke-dashoffset="${CIRCUMFERENCE}"
                                    transform="rotate(-90 16 16)"/>
                            </svg>
                            <div class="digit-num">${i}</div>
                        </div>
                        <div class="digit-pct" id="pct-${i}">0%</div>
                    </div>
                `;
            }
        }
        initDigitRow();

        function updateDigitStats(price) {
            const lastDigit = Math.floor(price) % 10;
            digitCounts[lastDigit]++;
            totalDigits++;
            
            for(let i=0; i<=9; i++) {
                const pct = totalDigits > 0 ? (digitCounts[i] / totalDigits) * 100 : 0;
                const offset = CIRCUMFERENCE - (pct / 100) * CIRCUMFERENCE;
                
                document.getElementById(`pct-${i}`).innerText = pct.toFixed(1) + '%';
                
                const progCircle = document.getElementById(`prog-${i}`);
                progCircle.style.strokeDashoffset = offset;
                
                if(pct >= 10) {
                    progCircle.style.stroke = 'var(--success-green)';
                } else {
                    progCircle.style.stroke = 'var(--danger-red)';
                }
            }
        }

        // --- TRADING FUNCTIONS ---
        let stats = { total: 0, wins: 0, losses: 0, pnl: 0 };

        function setStake(val) { document.getElementById('stakeAmount').value = val; }
        
        function adjustStake(delta) {
            const input = document.getElementById('stakeAmount');
            let val = parseInt(input.value) || 0;
            val = Math.max(1, val + delta);
            input.value = val;
        }

        async function placeTrade(direction) {
            if (!obxSupabase) return alert("System error: Supabase not loaded.");
            
            const stake = parseFloat(document.getElementById('stakeAmount').value);
            const entryPrice = currentPrice;
            
            const { data: { user } } = await obxSupabase.auth.getUser();
            if(!user) return alert("Please login first via index.html");

            const { error } = await obxSupabase.from('trades').insert({
                user_id: user.id, asset: 'VOL_10', direction: direction, 
                stake: stake, entry_price: entryPrice, status: 'OPEN'
            });

            if(error) console.error(error);
            else {
                stats.total++;
                const won = Math.random() > 0.5;
                if(won) {
                    stats.wins++;
                    stats.pnl += stake * 0.952;
                } else {
                    stats.losses++;
                    stats.pnl -= stake;
                }
                
                document.getElementById('liveStatsText').innerText = `${stats.total}T · ${stats.wins}W · ${stats.losses}L`;
                
                const pnlEl = document.getElementById('livePnl');
                const sign = stats.pnl >= 0 ? '+' : '';
                pnlEl.innerText = `${sign}$${Math.abs(stats.pnl).toFixed(2)}`;
                pnlEl.className = `live-pnl ${stats.pnl >= 0 ? 'positive' : 'negative'}`;

                if(navigator.vibrate) navigator.vibrate(50);
            }
        }
    </script>
</body>
</html>
