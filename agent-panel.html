<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBX PRIME | Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #111b21; color: #e9edef; font-family: system-ui, sans-serif; }
        .msg-bubble { max-width: 70%; padding: 8px 12px; border-radius: 12px; word-wrap: break-word; }
        .msg-sent { background-color: #005c4b; align-self: flex-end; }
        .msg-received { background-color: #202c33; align-self: flex-start; }
        
        /* Login Screen Styles */
        #login-screen { display: flex; }
        #agent-dashboard { display: none; }
    </style>
</head>
<body class="h-screen overflow-hidden">

    <!-- ==========================================
         LOGIN SCREEN
         ========================================== -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0b141a] p-4">
        <div class="bg-[#1f2c34] p-8 rounded-2xl shadow-2xl w-full max-w-md border border-black/20">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-purple-600 to-pink-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold text-white">OBX</div>
                <h1 class="text-2xl font-bold text-white">Agent Login</h1>
                <p class="text-gray-400 text-sm mt-2">Sign in to manage support chats</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Email</label>
                    <input type="email" id="agent-email" required class="w-full bg-[#111b21] border border-black/20 rounded-lg px-4 py-3 text-white outline-none focus:border-purple-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Password</label>
                    <input type="password" id="agent-password" required class="w-full bg-[#111b21] border border-black/20 rounded-lg px-4 py-3 text-white outline-none focus:border-purple-500 transition">
                </div>
                <button type="submit" id="login-btn" class="w-full bg-[#00a884] hover:bg-[#008f72] text-white font-bold py-3 rounded-lg transition mt-4">
                    Sign In
                </button>
                <p id="login-error" class="text-red-400 text-sm text-center hidden">Invalid email or password.</p>
            </form>
        </div>
    </div>

    <!-- ==========================================
         AGENT DASHBOARD (Hidden until logged in)
         ========================================== -->
    <div id="agent-dashboard" class="h-screen flex">
        <!-- Sidebar: Chat List -->
        <aside class="w-80 bg-[#111b21] border-r border-black/20 flex flex-col">
            <div class="p-4 bg-[#1f2c34] font-bold text-lg flex justify-between items-center">
                <span>Agent Panel</span>
                <button onclick="logout()" class="text-xs bg-red-500/20 text-red-400 px-2 py-1 rounded hover:bg-red-500/30">Logout</button>
            </div>
            <div class="p-3 border-b border-black/20">
                <input type="text" placeholder="Search chats..." class="w-full bg-[#202c33] rounded-lg px-4 py-2 text-sm outline-none text-white placeholder-gray-500">
            </div>
            <div id="room-list" class="flex-1 overflow-y-auto">
                <!-- Rooms injected here -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col bg-[#0b141a] relative">
            <div id="empty-state" class="flex-1 flex items-center justify-center text-gray-500 flex-col gap-2">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="opacity-20"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <p>Select a chat from the left to start messaging</p>
            </div>
            
            <div id="active-chat" class="hidden flex-1 flex flex-col h-full">
                <header class="bg-[#1f2c34] p-4 flex justify-between items-center border-b border-black/20">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gray-600 flex items-center justify-center font-bold">U</div>
                        <div>
                            <h2 class="font-bold text-sm">User Chat</h2>
                            <p class="text-xs text-green-500" id="room-status">● Active</p>
                        </div>
                    </div>
                    <button onclick="closeRoom()" class="bg-red-500/20 text-red-400 px-3 py-1.5 rounded text-sm hover:bg-red-500/30 transition">Close Chat</button>
                </header>

                <div id="chat-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 bg-[#0b141a]">
                    <!-- Messages -->
                </div>

                <footer class="bg-[#1f2c34] p-3 flex gap-2 border-t border-black/20">
                    <input type="text" id="agent-input" placeholder="Type a message..." class="flex-1 bg-[#2a3942] rounded-lg px-4 py-2.5 outline-none text-white placeholder-gray-400" onkeypress="if(event.key==='Enter') sendAgentMessage()">
                    <button onclick="sendAgentMessage()" class="bg-[#00a884] hover:bg-[#008f72] px-6 py-2 rounded-lg font-bold text-white transition">Send</button>
                </footer>
            </div>
        </main>
    </div>

        <script>
        // Wait for the page to fully load before running any code
        document.addEventListener('DOMContentLoaded', async function() {
            
            // 1. Check if Supabase loaded correctly
            if (typeof window.supabase === 'undefined') {
                alert("ERROR: Supabase script failed to load. Check your internet connection.");
                return;
            }

            // --- SUPABASE CONFIG ---
            const SUPABASE_URL = 'https://twwwpywcmjdrocsfhyia.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            let agentId = null;
            let activeRoomId = null;

            // --- LOGIN LOGIC ---
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault(); // STRICTLY stops the page from refreshing
                    
                    const btn = document.getElementById('login-btn');
                    const errorText = document.getElementById('login-error');
                    const email = document.getElementById('agent-email').value.trim();
                    const password = document.getElementById('agent-password').value;

                    // Basic validation
                    if (!email || !password) {
                        alert("Please enter both email and password.");
                        return;
                    }

                    btn.innerText = 'Signing in...';
                    btn.disabled = true;
                    errorText.classList.add('hidden');

                    try {
                        // Attempt to Sign In
                        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                        if (error) {
                            // Show the EXACT error message in an alert AND on the screen
                            alert("Login Failed: " + error.message);
                            errorText.innerText = error.message;
                            errorText.classList.remove('hidden');
                            btn.innerText = 'Sign In';
                            btn.disabled = false;
                        } else {
                            // Success!
                            document.getElementById('login-screen').style.display = 'none';
                            document.getElementById('agent-dashboard').style.display = 'flex';
                            agentId = data.user.id;
                            loadRooms();
                            listenForRooms();
                        }
                    } catch (err) {
                        alert("Unexpected Error: " + err.message);
                        btn.innerText = 'Sign In';
                        btn.disabled = false;
                    }
                });
            }

            async function logout() {
                await supabase.auth.signOut();
                location.reload();
            }

            // --- DASHBOARD LOGIC ---
            async function loadRooms() {
                try {
                    const { data, error } = await supabase.from('support_rooms').select('*').in('status', ['waiting', 'active']).order('created_at', { ascending: false });
                    if (error) throw error;

                    const list = document.getElementById('room-list');
                    list.innerHTML = '';
                    
                    if (!data || data.length === 0) {
                        list.innerHTML = '<div class="p-4 text-center text-gray-500 text-sm">No active chats</div>';
                        return;
                    }

                    data.forEach(room => {
                        const div = document.createElement('div');
                        div.className = `p-4 border-b border-black/20 cursor-pointer hover:bg-[#202c33] transition ${room.status === 'waiting' ? 'bg-[#2a3942] border-l-4 border-l-yellow-500' : ''}`;
                        div.innerHTML = `
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-white">User: ${room.user_id.substring(0,8)}...</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full ${room.status === 'waiting' ? 'bg-yellow-500/20 text-yellow-500' : 'bg-green-500/20 text-green-500'}">${room.status}</span>
                            </div>
                            <div class="text-xs text-gray-400 mt-1">${new Date(room.created_at).toLocaleString()}</div>
                        `;
                        div.onclick = () => openRoom(room.id, room.status);
                        list.appendChild(div);
                    });
                } catch (err) {
                    console.error("Error loading rooms:", err);
                }
            }

            function listenForRooms() {
                supabase.channel('all-rooms').on('postgres_changes', { event: '*', schema: 'public', table: 'support_rooms' }, () => loadRooms()).subscribe();
            }

            async function openRoom(roomId, status) {
                activeRoomId = roomId;
                document.getElementById('empty-state').classList.add('hidden');
                document.getElementById('active-chat').classList.remove('hidden');
                document.getElementById('room-status').innerText = `● ${status}`;
                
                if (status === 'waiting') {
                    await supabase.from('support_rooms').update({ agent_id: agentId, status: 'active' }).eq('id', roomId);
                }

                const { data } = await supabase.from('support_messages').select('*').eq('room_id', roomId).order('created_at', { ascending: true });
                const container = document.getElementById('chat-container');
                container.innerHTML = '';
                
                data.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `flex w-full ${msg.sender_type === 'agent' ? 'justify-end' : 'justify-start'}`;
                    div.innerHTML = `<div class="msg-bubble ${msg.sender_type === 'agent' ? 'msg-sent' : 'msg-received'}"><p class="text-sm">${msg.content}</p><p class="text-[10px] text-gray-400 text-right mt-1">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p></div>`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;

                supabase.channel('room-' + roomId).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'support_messages', filter: `room_id=eq.${roomId}` }, payload => {
                    const msg = payload.new;
                    const div = document.createElement('div');
                    div.className = `flex w-full ${msg.sender_type === 'agent' ? 'justify-end' : 'justify-start'}`;
                    div.innerHTML = `<div class="msg-bubble ${msg.sender_type === 'agent' ? 'msg-sent' : 'msg-received'}"><p class="text-sm">${msg.content}</p><p class="text-[10px] text-gray-400 text-right mt-1">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p></div>`;
                    container.appendChild(div);
                    container.scrollTop = container.scrollHeight;
                }).subscribe();
            }

            async function sendAgentMessage() {
                const input = document.getElementById('agent-input');
                if (!input.value.trim() || !activeRoomId) return;
                await supabase.from('support_messages').insert({
                    room_id: activeRoomId, sender_id: agentId, sender_type: 'agent', content: input.value, type: 'text'
                });
                input.value = '';
            }

            async function closeRoom() {
                if(!activeRoomId) return;
                await supabase.from('support_rooms').update({ status: 'closed' }).eq('id', activeRoomId);
                document.getElementById('active-chat').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
                activeRoomId = null;
                loadRooms();
            }
        });
    </script>
</body>
</html>
