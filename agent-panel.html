<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBX PRIME | Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #111b21; color: #e9edef; font-family: system-ui, sans-serif; }
        .msg-bubble { max-width: 70%; padding: 8px 12px; border-radius: 12px; word-wrap: break-word; }
        .msg-sent { background-color: #005c4b; align-self: flex-end; }
        .msg-received { background-color: #202c33; align-self: flex-start; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">
    <!-- Sidebar: Chat List -->
    <aside class="w-80 bg-[#111b21] border-r border-black/20 flex flex-col">
        <div class="p-4 bg-[#1f2c34] font-bold text-lg">Agent Panel</div>
        <div id="room-list" class="flex-1 overflow-y-auto">
            <!-- Rooms injected here -->
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col bg-[#0b141a] relative">
        <div id="empty-state" class="flex-1 flex items-center justify-center text-gray-500">Select a chat to start messaging</div>
        
        <div id="active-chat" class="hidden flex-1 flex flex-col h-full">
            <header class="bg-[#1f2c34] p-4 flex justify-between items-center border-b border-black/20">
                <div>
                    <h2 class="font-bold">User Chat</h2>
                    <p class="text-xs text-green-500" id="room-status">● Active</p>
                </div>
                <button onclick="closeRoom()" class="bg-red-500/20 text-red-500 px-3 py-1 rounded text-sm">Close Chat</button>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
                <!-- Messages -->
            </div>

            <footer class="bg-[#1f2c34] p-3 flex gap-2">
                <input type="text" id="agent-input" placeholder="Type a message..." class="flex-1 bg-[#2a3942] rounded-lg px-4 py-2 outline-none text-white" onkeypress="if(event.key==='Enter') sendAgentMessage()">
                <button onclick="sendAgentMessage()" class="bg-[#00a884] px-6 py-2 rounded-lg font-bold text-white">Send</button>
            </footer>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://twwwpywcmjdrocsfhyia.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let agentId = null;
        let activeRoomId = null;

        async function initAgent() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) { alert("Agent must be logged in via Supabase Auth!"); return; }
            agentId = user.id;
            loadRooms();
            listenForRooms();
        }

        async function loadRooms() {
            const { data } = await supabase.from('support_rooms').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('room-list');
            list.innerHTML = '';
            data.forEach(room => {
                const div = document.createElement('div');
                div.className = `p-4 border-b border-black/20 cursor-pointer hover:bg-[#202c33] ${room.status === 'waiting' ? 'bg-[#2a3942]' : ''}`;
                div.innerHTML = `<div class="font-bold text-sm">User ID: ${room.user_id.substring(0,8)}...</div><div class="text-xs text-gray-400 mt-1">Status: ${room.status}</div>`;
                div.onclick = () => openRoom(room.id, room.status);
                list.appendChild(div);
            });
        }

        function listenForRooms() {
            supabase.channel('all-rooms').on('postgres_changes', { event: '*', schema: 'public', table: 'support_rooms' }, () => loadRooms()).subscribe();
        }

        async function openRoom(roomId, status) {
            activeRoomId = roomId;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('active-chat').classList.remove('hidden');
            document.getElementById('room-status').innerText = `● ${status}`;
            
            // Assign agent if waiting
            if (status === 'waiting') {
                await supabase.from('support_rooms').update({ agent_id: agentId, status: 'active' }).eq('id', roomId);
            }

            const { data } = await supabase.from('support_messages').select('*').eq('room_id', roomId).order('created_at', { ascending: true });
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            data.forEach(msg => {
                const div = document.createElement('div');
                div.className = `flex w-full ${msg.sender_type === 'agent' ? 'justify-end' : 'justify-start'}`;
                div.innerHTML = `<div class="msg-bubble ${msg.sender_type === 'agent' ? 'msg-sent' : 'msg-received'}"><p>${msg.content}</p><p class="text-[10px] text-gray-400 text-right mt-1">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p></div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;

            supabase.channel('room-' + roomId).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'support_messages' }, payload => {
                const msg = payload.new;
                const div = document.createElement('div');
                div.className = `flex w-full ${msg.sender_type === 'agent' ? 'justify-end' : 'justify-start'}`;
                div.innerHTML = `<div class="msg-bubble ${msg.sender_type === 'agent' ? 'msg-sent' : 'msg-received'}"><p>${msg.content}</p></div>`;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }).subscribe();
        }

        async function sendAgentMessage() {
            const input = document.getElementById('agent-input');
            if (!input.value.trim() || !activeRoomId) return;
            await supabase.from('support_messages').insert({
                room_id: activeRoomId, sender_id: agentId, sender_type: 'agent', content: input.value, type: 'text'
            });
            input.value = '';
        }

        async function closeRoom() {
            await supabase.from('support_rooms').update({ status: 'closed' }).eq('id', activeRoomId);
            document.getElementById('active-chat').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
            loadRooms();
        }

        initAgent();
    </script>
</body>
</html>
