<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBX PRIME | My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #141021; color: white; font-family: system-ui; }</style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center">
    <div class="w-full max-w-md bg-[#1F1936] rounded-2xl p-6 border border-white/10 shadow-2xl">
        <div class="text-center mb-8">
            <div id="profile-avatar" class="w-24 h-24 rounded-full bg-[#7C3AED] mx-auto flex items-center justify-center text-4xl font-bold mb-4 shadow-lg shadow-purple-900/50">U</div>
            <h1 id="profile-name" class="text-2xl font-bold">Loading...</h1>
            <p id="profile-email" class="text-gray-400 mt-1">Loading...</p>
        </div>
        
        <div class="space-y-3">
            <button onclick="window.location.href='dashboard.html'" class="w-full py-3.5 bg-[#7C3AED] hover:bg-[#6D28D9] rounded-xl font-semibold transition shadow-lg shadow-purple-900/30">Back to Trading</button>
            <button onclick="logoutUser()" class="w-full py-3.5 border border-red-500/50 text-red-400 hover:bg-red-500/10 rounded-xl font-semibold transition">Log Out</button>
        </div>
    </div>

    <script>
        // Load profile data immediately
        document.addEventListener('DOMContentLoaded', () => {
            const name = localStorage.getItem('userName');
            const email = localStorage.getItem('userEmail');
            
            // Fallback if data is missing
            const displayName = name || 'Guest User';
            const displayEmail = email || 'No email found';
            
            document.getElementById('profile-name').innerText = displayName;
            document.getElementById('profile-email').innerText = displayEmail;
            document.getElementById('profile-avatar').innerText = displayName.charAt(0).toUpperCase();
            
            // Security check
            if(localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = 'signin.html';
            }
        });

        function logoutUser() {
            localStorage.clear();
            window.location.href = 'signin.html';
        }
    </script>
</body>
</html>
