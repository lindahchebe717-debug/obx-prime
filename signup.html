<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBX PRIME | Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #141021; color: white; font-family: system-ui, -apple-system, sans-serif; }
        .input-field { 
            background-color: rgba(30, 27, 75, 0.5); border: 1px solid rgba(255,255,255,0.1); 
            transition: all 0.2s ease; 
        }
        .input-field:focus { 
            border-color: #7C3AED; box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.2); outline: none; 
        }
        /* Custom checkbox */
        .custom-checkbox:checked { background-color: #7C3AED; border-color: #7C3AED; }
        
        /* Loading Spinner */
        .spinner {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#1F1936] rounded-2xl shadow-2xl border border-white/5 p-8">
        <!-- Logo Area -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-[#7C3AED] to-[#EC4899] rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-[#7C3AED]/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Create Account</h1>
            <p class="text-gray-400 text-sm mt-2">Join OBX PRIME and start trading today</p>
        </div>

        <form onsubmit="handleSignup(event)" class="space-y-4">
            <!-- Full Name -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Full Name</label>
                <input type="text" id="signup-name" required placeholder="e.g., John Doe" class="input-field w-full rounded-xl px-4 py-3.5 text-white placeholder-gray-600">
            </div>

            <!-- Email -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" id="signup-email" required placeholder="name@example.com" class="input-field w-full rounded-xl px-4 py-3.5 text-white placeholder-gray-600">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="signup-pass" required placeholder="••••••••" minlength="6" class="input-field w-full rounded-xl px-4 py-3.5 text-white placeholder-gray-600 pr-12">
                    <button type="button" onclick="togglePass('signup-pass')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Confirm Password</label>
                <input type="password" id="signup-confirm-pass" required placeholder="••••••••" class="input-field w-full rounded-xl px-4 py-3.5 text-white placeholder-gray-600">
            </div>

            <!-- Terms Checkbox -->
            <div class="flex items-start gap-3 pt-2">
                <input type="checkbox" id="terms-check" required class="custom-checkbox mt-1 w-4 h-4 rounded border-gray-600 bg-transparent text-[#7C3AED] focus:ring-[#7C3AED]">
                <p class="text-xs text-gray-400 leading-relaxed">I agree to the <a href="#" class="text-[#7C3AED] hover:underline">Terms of Service</a> and <a href="#" class="text-[#7C3AED] hover:underline">Privacy Policy</a>.</p>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="signup-btn" class="w-full bg-gradient-to-r from-[#7C3AED] to-[#6D28D9] hover:opacity-90 text-white font-bold py-4 rounded-xl transition-all active:scale-[0.98] shadow-lg shadow-[#7C3AED]/25 mt-6 flex items-center justify-center gap-2">
                <span>Create Account</span>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="mt-8 text-center">
            <p class="text-sm text-gray-400">Already have an account? <a href="signin.html" class="text-[#7C3AED] font-semibold hover:text-[#8B5CF6] transition-colors">Sign In</a></p>
        </div>
    </div>

    <script>
        // ==========================================
        // SUPABASE CONFIGURATION
        // ==========================================
        const SUPABASE_URL = 'https://twwwpywcmjdrocsfhyia.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function togglePass(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function handleSignup(e) {
            e.preventDefault();
            
            const btn = document.getElementById('signup-btn');
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-pass').value;
            const confirmPass = document.getElementById('signup-confirm-pass').value;

            // Validate passwords match
            if (password !== confirmPass) {
                alert('❌ Passwords do not match! Please try again.');
                return;
            }

            // Show loading state
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>';

            // Create user in Supabase
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { full_name: name } // Saves name to Supabase metadata
                }
            });

            if (error) {
                alert('❌ ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<span>Create Account</span>';
            } else {
                // Save to localStorage for static pages to read
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userName', name);
                localStorage.setItem('userEmail', email);
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
