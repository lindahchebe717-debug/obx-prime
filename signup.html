<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBX PRIME | Create Account</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-wrapper">
    <div class="auth-card">
        <h1 class="logo" style="text-align:center; margin-bottom: 0.5rem;">OBX PRIME</h1>
        <p style="text-align:center; color:var(--text-gray); font-size:0.9rem; margin-bottom:2rem;">Start your trading journey today</p>
        
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="e.g. CitraTrader">
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="input-group">
            <label>Password (Min 6 chars)</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button class="btn-primary" style="width:100%; margin-top:1rem;" onclick="handleSignup()">Create Free Account</button>
        
        <p style="text-align:center; margin-top:1.5rem; color:var(--text-gray); font-size:0.85rem;">
            Already have an account? <a href="signin.html" style="color:var(--primary-purple);">Sign In</a>
        </p>
    </div>

    <script>
        const OBX_SUPABASE_URL = 'https://twvwwpywcmjdrocsfhya.supabase.co';
        const OBX_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8';
        
        let obxSupabase;
        if (typeof window.supabase !== 'undefined' && typeof obxSupabase === 'undefined') {
            obxSupabase = window.supabase.createClient(OBX_SUPABASE_URL, OBX_SUPABASE_ANON_KEY);
            console.log("✅ OBX Supabase client initialized");
        }

        async function handleSignup() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !email || !password) return alert("All fields are required");
            if (password.length < 6) return alert("Password must be at least 6 characters");
            if (!obxSupabase) return alert("System error: Supabase not loaded.");

            const { data, error } = await obxSupabase.auth.signUp({ 
                email, 
                password,
                options: { data: { username } } 
            });

            if (error) return alert(error.message);

            if (data.user) {
                await obxSupabase.from('profiles').insert({
                    id: data.user.id,
                    username: username,
                    balance: 0
                });
                
                alert("Account created! Check your email to verify.");
                window.location.href = 'signin.html';
            }
        }
    </script>
</body>
</html>
