<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBX PRIME | Support</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #f8fafc; --bg-card: #ffffff; --text-white: #1e293b;
            --text-gray: #64748b; --primary-purple: #7c3aed; --border-color: rgba(0, 0, 0, 0.08);
        }
        body.dark-theme {
            --bg-main: #141021; --bg-card: #1e1b4b; --text-white: #ffffff;
            --text-gray: #9ca3af; --border-color: rgba(255, 255, 255, 0.1);
        }
        body { background-color: var(--bg-main); color: var(--text-white); font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 50; }
        .header-title { font-size: 1.25rem; font-weight: 700; }
        .back-btn { background: none; border: none; cursor: pointer; padding: 8px; display: flex; align-items: center; color: var(--text-white); }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 100px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .email-box { display: flex; align-items: center; gap: 12px; padding: 16px; background: rgba(124, 58, 237, 0.1); border-radius: 12px; margin-bottom: 24px; text-decoration: none; color: var(--primary-purple); font-weight: 600; transition: background 0.2s; }
        .email-box:hover { background: rgba(124, 58, 237, 0.15); }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-gray); }
        .form-input, .form-textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-main); color: var(--text-white); font-size: 0.95rem; box-sizing: border-box; font-family: inherit; }
        .form-textarea { min-height: 150px; resize: vertical; }
        .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--primary-purple); }
        .submit-btn { width: 100%; padding: 14px; background: var(--primary-purple); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; transition: opacity 0.2s; }
        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-gray); text-decoration: none; font-size: 0.6rem; font-weight: 600; flex: 1; height: 100%; justify-content: center; }
        .nav-item.active { color: var(--primary-purple); }
        .nav-icon { width: 20px; height: 20px; }

        /* ✅ NEW: Ticket List & Chat Thread Styles */
        .ticket-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 12px; cursor: pointer; transition: background 0.2s; background: var(--bg-card); }
        .ticket-item:hover { background: rgba(124, 58, 237, 0.05); }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .status-open { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .status-progress { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .status-resolved { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: var(--bg-card); width: 100%; max-width: 600px; max-height: 85vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .chat-thread { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .chat-bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; position: relative; }
        .chat-bubble.client { background: var(--primary-purple); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-bubble.admin { background: var(--bg-main); color: var(--text-white); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }
        .chat-meta { font-size: 0.7rem; opacity: 0.7; margin-top: 6px; text-align: right; }
        .chat-bubble.admin .chat-meta { text-align: left; }
        .reply-box { padding: 16px; border-top: 1px solid var(--border-color); display: flex; gap: 12px; align-items: flex-end; }
        .reply-input { flex: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: 20px; background: var(--bg-main); color: var(--text-white); resize: none; min-height: 44px; max-height: 120px; }
        .reply-input:focus { outline: none; border-color: var(--primary-purple); }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--primary-purple); color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="header-title">Support Center</div>
        <div style="width: 40px;"></div>
    </div>

    <div class="container">
        <a href="mailto:obxprimesupport@gmail.com" class="email-box">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>obxprimesupport@gmail.com</span>
        </a>

        <!-- ✅ NEW: My Tickets List -->
        <div class="card">
            <h2 style="margin-top: 0; margin-bottom: 16px; font-size: 1.2rem;">My Tickets</h2>
            <div id="my-tickets-list">
                <p style="text-align: center; color: var(--text-gray); padding: 20px;">Loading your tickets...</p>
            </div>
        </div>

        <!-- New Ticket Form -->
        <div class="card">
            <h2 style="margin-top: 0; margin-bottom: 20px; font-size: 1.2rem;">Open a New Support Ticket</h2>
            <form id="supportForm" onsubmit="submitTicket(event)">
                <div class="form-group">
                    <label class="form-label">Subject</label>
                    <input type="text" class="form-input" id="ticketSubject" placeholder="e.g., Withdrawal issue, Account verification" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Message</label>
                    <textarea class="form-textarea" id="ticketMessage" placeholder="Please describe your issue in detail..." required></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Submit Ticket</button>
            </form>
        </div>
    </div>

    <!-- ✅ NEW: Ticket Thread Modal -->
    <div class="modal-overlay" id="ticketModal" onclick="closeTicketModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div>
                    <h3 style="margin: 0; font-size: 1.1rem;" id="modal-ticket-subject">Subject</h3>
                    <span class="status-badge" id="modal-ticket-status" style="margin-top: 4px; display: inline-block;">Open</span>
                </div>
                <button onclick="closeTicketModal()" style="background: none; border: none; color: var(--text-gray); cursor: pointer; padding: 8px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            
            <div class="chat-thread" id="chat-thread">
                <!-- Messages will be injected here -->
            </div>

            <div class="reply-box">
                <textarea class="reply-input" id="reply-input" placeholder="Type your reply..." rows="1" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
                <button class="send-btn" id="send-reply-btn" onclick="sendClientReply()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h2v8H3zm6-4h2v12H9zm6-4h2v16h-2zm6-4h2v20h-2z"/></svg>
            <span>Trade</span>
        </a>
        <a href="ai.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg>
            <span>AI</span>
        </a>
        <a href="support.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Support</span>
        </a>
    </nav>

    <script>
        const OBX_SUPABASE_URL = 'https://twvwwpywcmjdrocsfhya.supabase.co';
        const OBX_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8';
        let obxSupabase;
        let currentUser = null;
        let currentOpenTicketId = null;

        if (typeof window.supabase !== 'undefined') {
            obxSupabase = window.supabase.createClient(OBX_SUPABASE_URL, OBX_SUPABASE_ANON_KEY);
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }

        // Initialize
        window.addEventListener('load', async () => {
            const { data: { user } } = await obxSupabase.auth.getUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            loadMyTickets();
        });

        // ✅ NEW: Load user's tickets
        async function loadMyTickets() {
            const container = document.getElementById('my-tickets-list');
            try {
                const { data: tickets, error } = await obxSupabase
                    .from('support_tickets')
                    .select('id, subject, status, created_at')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!tickets || tickets.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-gray); padding: 20px;">You have no open tickets. Create one below!</p>';
                    return;
                }

                container.innerHTML = tickets.map(t => {
                    let statusClass = 'status-open';
                    if (t.status === 'In Progress') statusClass = 'status-progress';
                    if (t.status === 'Resolved') statusClass = 'status-resolved';
                    
                    const date = new Date(t.created_at).toLocaleDateString();
                    return `
                        <div class="ticket-item" onclick="openTicketThread('${t.id}')">
                            <div>
                                <div style="font-weight: 600; margin-bottom: 4px;">${t.subject}</div>
                                <div style="font-size: 0.8rem; color: var(--text-gray);">${date}</div>
                            </div>
                            <span class="status-badge ${statusClass}">${t.status}</span>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error('Error loading tickets:', err);
                container.innerHTML = '<p style="text-align: center; color: var(--danger-red); padding: 20px;">Failed to load tickets.</p>';
            }
        }

        // ✅ NEW: Open ticket thread modal
        async function openTicketThread(ticketId) {
            currentOpenTicketId = ticketId;
            document.getElementById('ticketModal').classList.add('show');
            document.getElementById('reply-input').value = '';
            
            try {
                // 1. Get ticket details
                const { data: ticket } = await obxSupabase.from('support_tickets').select('subject, status').eq('id', ticketId).single();
                document.getElementById('modal-ticket-subject').innerText = ticket.subject;
                
                const statusEl = document.getElementById('modal-ticket-status');
                statusEl.innerText = ticket.status;
                statusEl.className = 'status-badge ' + (ticket.status === 'In Progress' ? 'status-progress' : ticket.status === 'Resolved' ? 'status-resolved' : 'status-open');

                // 2. Get original message + replies
                const { data: replies } = await obxSupabase
                    .from('ticket_replies')
                    .select('sender_role, message, created_at')
                    .eq('ticket_id', ticketId)
                    .order('created_at', { ascending: true });

                const threadContainer = document.getElementById('chat-thread');
                threadContainer.innerHTML = '';

                // Add original message as first client bubble
                const { data: originalTicket } = await obxSupabase.from('support_tickets').select('message, created_at').eq('id', ticketId).single();
                appendChatBubble('client', originalTicket.message, originalTicket.created_at);

                // Add replies
                if (replies) {
                    replies.forEach(r => {
                        appendChatBubble(r.sender_role, r.message, r.created_at);
                    });
                }

                // Scroll to bottom
                setTimeout(() => {
                    threadContainer.scrollTop = threadContainer.scrollHeight;
                }, 100);

            } catch (err) {
                console.error('Error loading thread:', err);
            }
        }

        function appendChatBubble(role, message, timestamp) {
            const threadContainer = document.getElementById('chat-thread');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${role}`;
            
            const timeStr = new Date(timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            const senderLabel = role === 'admin' ? 'Support Team' : 'You';
            
            bubble.innerHTML = `
                <div style="font-size: 0.75rem; font-weight: 700; margin-bottom: 4px; opacity: 0.8;">${senderLabel}</div>
                <div style="white-space: pre-wrap;">${message}</div>
                <div class="chat-meta">${timeStr}</div>
            `;
            threadContainer.appendChild(bubble);
        }

        function closeTicketModal(event) {
            if (!event || event.target.id === 'ticketModal') {
                document.getElementById('ticketModal').classList.remove('show');
                currentOpenTicketId = null;
            }
        }

        // ✅ NEW: Send client reply
        async function sendClientReply() {
            const input = document.getElementById('reply-input');
            const message = input.value.trim();
            if (!message || !currentOpenTicketId) return;

            const btn = document.getElementById('send-reply-btn');
            btn.disabled = true;

            try {
                // 1. Insert reply
                const { error: replyError } = await obxSupabase.from('ticket_replies').insert({
                    ticket_id: currentOpenTicketId,
                    sender_role: 'client',
                    message: message,
                    created_at: new Date().toISOString()
                });
                if (replyError) throw replyError;

                // 2. If ticket was resolved, reopen it to "In Progress"
                const { data: ticket } = await obxSupabase.from('support_tickets').select('status').eq('id', currentOpenTicketId).single();
                if (ticket.status === 'Resolved') {
                    await obxSupabase.from('support_tickets').update({ status: 'In Progress' }).eq('id', currentOpenTicketId);
                }

                // 3. Update UI
                input.value = '';
                input.style.height = '';
                appendChatBubble('client', message, new Date().toISOString());
                const threadContainer = document.getElementById('chat-thread');
                threadContainer.scrollTop = threadContainer.scrollHeight;
                
                // Refresh list in background
                loadMyTickets();

            } catch (err) {
                console.error('Error sending reply:', err);
                alert('Failed to send reply. Please try again.');
            } finally {
                btn.disabled = false;
            }
        }

        async function submitTicket(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const subject = document.getElementById('ticketSubject').value;
            const message = document.getElementById('ticketMessage').value;

            btn.disabled = true;
            btn.innerText = 'Submitting...';

            try {
                const { error } = await obxSupabase.from('support_tickets').insert({
                    user_id: currentUser.id,
                    subject: subject,
                    message: message,
                    status: 'Open',
                    created_at: new Date().toISOString()
                });

                if (error) throw error;

                alert('✅ Support ticket submitted successfully! We will reply shortly.');
                document.getElementById('supportForm').reset();
                loadMyTickets(); // Refresh the list
            } catch (err) {
                console.error('Error submitting ticket:', err);
                alert('❌ Failed to submit ticket. Please try again or email us directly.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Submit Ticket';
            }
        }
    </script>
</body>
</html>
