        Download App

    <p class="text-white/40 text-xs mt-4">Version 1.0.0 · 12.4 MB · Android & iOS</p>

    <script>
        function downloadApp() {
            // Create a simple text file as a demo download (replace with real APK/IPA later)
            const content = "OBX PRIME Trading App\n\nThank you for downloading OBX PRIME!\n\nThis is a placeholder for the actual mobile app (APK/IPA file).\n\nTo install the real app:\n1. Contact support for the latest APK file\n2. Enable 'Install from Unknown Sources' in your phone settings\n3. Open the downloaded APK file\n4. Follow the installation prompts\n\nFor iOS: Visit the App Store (coming soon)";
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'OBX_PRIME_App_Info.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            setTimeout(() => {
                alert('✅ Download started!\n\nNote: This is a demo download. For the real mobile app, please contact our support team or check back soon for the official APK release.');
            }, 500);
        }
    </script>
