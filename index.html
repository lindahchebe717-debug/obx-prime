<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBX PRIME | Secure Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-wrapper">
    <div class="auth-card">
        <h1 class="logo" style="text-align:center; margin-bottom: 2rem;">OBX PRIME</h1>
        
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="trader@obxprime.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button class="btn-primary" style="width:100%; margin-top:1rem;" onclick="handleLogin()">Sign In to Trade</button>
        <p style="text-align:center; margin-top:1.5rem; color:var(--text-gray); font-size:0.85rem;">
            Don't have an account? <a href="#" style="color:var(--primary-purple);">Create one</a>
        </p>
    </div>

    <script>
        const SUPABASE_URL = 'https://twvwwpywcmjdrocsfhya.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) return alert("Please enter both email and password");
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) return alert(error.message);
            
            localStorage.setItem('obx_token', data.session.access_token);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
