<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBX PRIME</title>
    <style>
        body { background: #0f0a1a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .header { background: #7c3aed; padding: 15px; display: flex; align-items: center; gap: 15px; }
        /* RAW DISPLAY TOGGLE - NO CLASSES, NO ANIMATIONS */
        #sidebar { position: fixed; top: 0; left: 0; width: 250px; height: 100%; background: #130f1c; z-index: 9999; display: none; padding: 20px; border-right: 1px solid #2a1f3d; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9998; display: none; }
        .menu-link { display: block; padding: 15px 0; color: white; text-decoration: none; border-bottom: 1px solid #2a1f3d; font-size: 1.1rem; }
        .btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 50px; height: 50px; font-size: 1.5rem; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- OVERLAY -->
    <div id="overlay" onclick="document.getElementById('sidebar').style.display='none'; document.getElementById('overlay').style.display='none';"></div>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <h2 style="margin-bottom: 20px;">Menu</h2>
        <a href="#" class="menu-link" onclick="document.getElementById('sidebar').style.display='none'; document.getElementById('overlay').style.display='none';">🏠 Home</a>
        <a href="#" class="menu-link" onclick="document.getElementById('sidebar').style.display='none'; document.getElementById('overlay').style.display='none';">⬇️ Deposit</a>
        <a href="#" class="menu-link" onclick="document.getElementById('sidebar').style.display='none'; document.getElementById('overlay').style.display='none';">⬆️ Withdraw</a>
        <a href="#" class="menu-link" onclick="document.getElementById('sidebar').style.display='none'; document.getElementById('overlay').style.display='none';">🕐 History</a>
    </div>

    <!-- HEADER -->
    <div class="header">
        <!-- RAW INLINE JAVASCRIPT: NO FUNCTIONS, NO CLASSES -->
        <button class="btn" onclick="document.getElementById('sidebar').style.display='block'; document.getElementById('overlay').style.display='block'; alert('SUCCESS: The menu is now open!');">☰</button>
        <h1>OBX PRIME</h1>
    </div>

    <div style="padding: 20px;">
        <p>If you click the button above and see an alert, the code works perfectly.</p>
        <p>If you do NOT see an alert, your browser is loading an old, cached version of the file.</p>
    </div>

</body>
</html>
