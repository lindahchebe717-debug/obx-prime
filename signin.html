<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBX PRIME | Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #141021; color: white; font-family: system-ui, -apple-system, sans-serif; }
        .input-field { 
            background-color: rgba(30, 27, 75, 0.5); border: 1px solid rgba(255,255,255,0.1); 
            transition: all 0.2s ease; 
        }
        .input-field:focus { 
            border-color: #7C3AED; box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.2); outline: none; 
        }
        /* Loading Spinner */
        .spinner {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#1F1936] rounded-2xl shadow-2xl border border-white/5 p-8">
        <!-- Logo Area -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-[#7C3AED] to-[#EC4899] rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-[#7C3AED]/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Welcome Back</h1>
            <p class="text-gray-400 text-sm mt-2">Sign in to continue trading</p>
        </div>

        <form onsubmit="handleSignin(event)" class="space-y-5">
            <!-- Email -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" required placeholder="name@example.com" class="input-field w-full rounded-xl px-4 py-3.5 text-white placeholder-gray-600">
            </div>

            <!-- Password -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Password</label>
                    <a href="#" class="text-xs text-[#7C3AED] hover:text-[#8B5CF6] transition-colors">Forgot Password?</a>
                </div>
                <div class="relative">
                    <input type="password" id="signin-pass" required placeholder="••••••••" class="input-field w-full rounded-xl px-4 py-3.5 text-white placeholder-gray-600 pr-12">
                    <button type="button" onclick="togglePass('signin-pass')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="signin-btn" class="w-full bg-gradient-to-r from-[#7C3AED] to-[#6D28D9] hover:opacity-90 text-white font-bold py-4 rounded-xl transition-all active:scale-[0.98] shadow-lg shadow-[#7C3AED]/25 mt-4 flex items-center justify-center gap-2">
                <span>Sign In</span>
            </button>
        </form>

        <!-- Divider -->
        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
            <div class="relative flex justify-center text-xs"><span class="bg-[#1F1936] px-3 text-gray-500">OR CONTINUE WITH</span></div>
        </div>

        <!-- Social Login (Optional) -->
        <div class="grid grid-cols-2 gap-3">
            <button class="flex items-center justify-center gap-2 py-3 rounded-xl border border-white/10 hover:bg-white/5 transition-colors text-sm font-medium">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google
            </button>
            <button class="flex items-center justify-center gap-2 py-3 rounded-xl border border-white/10 hover:bg-white/5 transition-colors text-sm font-medium">
                <svg class="w-5 h-5" fill="#fff" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                Facebook
            </button>
        </div>

        <!-- Footer Link -->
        <div class="mt-8 text-center">
            <p class="text-sm text-gray-400">Don't have an account? <a href="signup.html" class="text-[#7C3AED] font-semibold hover:text-[#8B5CF6] transition-colors">Sign Up</a></p>
        </div>
    </div>

    <script>
        function togglePass(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }
        
        function handleSignin(e) {
            e.preventDefault();
            const btn = document.getElementById('signin-btn');
            
            // Show loading state
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>';
            
            // Simulate login delay
            setTimeout(() => {
                localStorage.setItem('isLoggedIn', 'true');
                // Redirect to the NEW dashboard file
                window.location.href = 'dashboard.html';
            }, 1500);
        }
    </script>
</body>
</html>
