<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBX PRIME | Withdraw Funds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #141021; }
        
        /* Light theme classes */
        body.light-theme {
            background-color: #f9fafb;
            color: #1f2937;
        }
        body.light-theme .bg-\[\#130f1c\],
        body.light-theme .bg-\[\#141021\],
        body.light-theme .bg-\[\#181329\],
        body.light-theme .bg-\[\#1F1936\],
        body.light-theme .bg-\[\#151a25\],
        body.light-theme .bg-\[\#1e1b4b\],
        body.light-theme .bg-\[\#1e2535\],
        body.light-theme .bg-\[\#252d3d\],
        body.light-theme .bg-\[\#282041\],
        body.light-theme .bg-\[\#2E2447\],
        body.light-theme .bg-\[\#2a3548\] {
            background-color: #ffffff !important;
        }
        body.light-theme .text-white { color: #1f2937 !important; }
        body.light-theme .text-gray-400 { color: #6b7280 !important; }
        body.light-theme .text-gray-500 { color: #6b7280 !important; }
        body.light-theme .border-white\/10,
        body.light-theme .border-white\/5,
        body.light-theme .border-white\/\[0\.07\] {
            border-color: rgba(0, 0, 0, 0.1) !important;
        }
        
        /* Payment Card Styles */
        .payment-card {
            background-color: rgba(30, 27, 75, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .payment-card:hover {
            background-color: rgba(124, 58, 237, 0.1);
            border-color: rgba(124, 58, 237, 0.4);
        }
        body.light-theme .payment-card {
            background-color: #ffffff;
            border-color: #e5e7eb;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        body.light-theme .payment-card:hover {
            border-color: #7C3AED;
        }
    </style>
</head>
<body class="antialiased text-white min-h-screen flex flex-col">

    <!-- Header -->
    <header class="shrink-0 flex items-center justify-between px-4 py-4 bg-[#1F1936] border-b border-white/10">
        <a href="index.html" class="flex items-center gap-2 text-white hover:text-[#A78BFA] transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
            <span class="font-bold">Back to Trade</span>
        </a>
        <div class="flex items-center gap-3">
            <button onclick="toggleSound()" id="sound-toggle" class="p-2 rounded-md bg-[#282041] transition-colors" title="Toggle Sound">
                <svg id="sound-icon-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#7C3AED]"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><path d="M16 9a5 5 0 0 1 0 6"></path><path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path></svg>
                <svg id="sound-icon-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500 hidden"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>
            </button>
            <button onclick="toggleDarkTheme()" class="p-2 rounded-md bg-[#282041] transition-colors" title="Toggle Theme">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#7C3AED]"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 max-w-2xl mx-auto w-full">
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-white mb-2">Withdraw Funds</h1>
            <p class="text-gray-400 text-sm">Withdraw your earnings securely to your preferred account.</p>
            
            <!-- Available Balance Card -->
            <div class="mt-6 p-5 rounded-2xl bg-[#1e1b4b] border border-[#7C3AED]/30 inline-block w-full max-w-sm">
                <p class="text-gray-400 text-xs uppercase tracking-wider mb-1">Available Balance</p>
                <p class="text-3xl font-extrabold text-white">$1,000.00</p>
            </div>
        </div>

        <div class="space-y-5">
            <!-- Amount Input -->
            <div>
                <label class="block text-sm font-semibold text-white mb-2">Withdrawal Amount</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold text-lg">$</span>
                    <input type="number" id="withdraw-amount" placeholder="0.00" class="w-full bg-[#130f1c] border border-white/10 rounded-xl pl-10 pr-4 py-3.5 text-white text-lg font-semibold focus:outline-none focus:border-[#7C3AED] focus:ring-1 focus:ring-[#7C3AED] transition-all">
                </div>
                <p class="text-xs text-gray-500 mt-2">Minimum withdrawal amount is $10.00</p>
            </div>

            <!-- Payment Method Selection -->
            <div>
                <label class="block text-sm font-semibold text-white mb-2">Select Withdrawal Method</label>
                <div class="space-y-3">
                    <!-- M-Pesa -->
                    <div class="payment-card flex items-center justify-between p-4 rounded-xl cursor-pointer" onclick="selectWithdrawMethod(this, 'mpesa')">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-lg bg-[#7C3AED]/20 flex items-center justify-center shrink-0">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#7C3AED]"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect><path d="M12 18h.01"></path></svg>
                            </div>
                            <div>
                                <div class="text-white font-bold text-base">M-Pesa</div>
                                <div class="text-gray-400 text-sm">Withdraw to mobile money</div>
                            </div>
                        </div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><path d="m9 18 6-6-6-6"></path></svg>
                    </div>

                    <!-- USDT TRC20 -->
                    <div class="payment-card flex items-center justify-between p-4 rounded-xl cursor-pointer" onclick="selectWithdrawMethod(this, 'usdt')">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-lg bg-[#10B981]/20 flex items-center justify-center shrink-0">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#10B981]"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path></svg>
                            </div>
                            <div>
                                <div class="text-white font-bold text-base">USDT (TRC20)</div>
                                <div class="text-gray-400 text-sm">Withdraw to crypto wallet</div>
                            </div>
                        </div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><path d="m9 18 6-6-6-6"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Withdraw Button -->
            <button onclick="processWithdrawal()" class="w-full mt-8 py-4 bg-gradient-to-r from-[#7C3AED] to-[#6D28D9] rounded-xl text-white font-bold text-lg shadow-lg shadow-[#7C3AED]/25 hover:shadow-[#7C3AED]/40 transition-all active:scale-[0.98]">
                Confirm Withdrawal
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 text-center text-xs text-gray-500 border-t border-white/5 bg-[#130f1c]">
        <p>&copy; 2026 OBX PRIME. All rights reserved.</p>
    </footer>

    <script>
        // Theme Toggle
        let isDarkTheme = true;
        function toggleDarkTheme() {
            isDarkTheme = !isDarkTheme;
            const body = document.body;
            if (isDarkTheme) {
                body.classList.remove('light-theme');
            } else {
                body.classList.add('light-theme');
            }
        }

        // Sound Toggle
        let isSoundOn = true;
        function toggleSound() {
            isSoundOn = !isSoundOn;
            const iconOn = document.getElementById('sound-icon-on');
            const iconOff = document.getElementById('sound-icon-off');
            if (isSoundOn) {
                iconOn.classList.remove('hidden');
                iconOff.classList.add('hidden');
            } else {
                iconOn.classList.add('hidden');
                iconOff.classList.remove('hidden');
            }
        }

        // Visual selection feedback
        function selectWithdrawMethod(element, method) {
            document.querySelectorAll('.payment-card').forEach(card => {
                card.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                card.style.backgroundColor = '';
            });
            element.style.borderColor = 'rgba(124, 58, 237, 0.8)';
            element.style.backgroundColor = 'rgba(124, 58, 237, 0.1)';
        }

        // Mock Withdrawal Process
        function processWithdrawal() {
            const amount = document.getElementById('withdraw-amount').value;
            if (!amount || amount <= 0) {
                alert('Please enter a valid withdrawal amount.');
                return;
            }
            if (amount < 10) {
                alert('Minimum withdrawal amount is $10.00.');
                return;
            }
            
            // In a real app, this would send a request to your backend
            alert(`Withdrawal request for $${amount} submitted successfully!\n\nIt will be processed shortly and you will receive a confirmation.`);
            document.getElementById('withdraw-amount').value = '';
            
            // Reset selection
            document.querySelectorAll('.payment-card').forEach(card => {
                card.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                card.style.backgroundColor = '';
            });
        }
    </script>
</body>
</html>
