<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBX PRIME | Transaction History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ADDED: Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #141021; }
        
        /* Light theme classes */
        body.light-theme { background-color: #f9fafb; color: #1f2937; }
        body.light-theme .bg-\[\#130f1c\], body.light-theme .bg-\[\#141021\], body.light-theme .bg-\[\#181329\], 
        body.light-theme .bg-\[\#1F1936\], body.light-theme .bg-\[\#151a25\], body.light-theme .bg-\[\#1e1b4b\], 
        body.light-theme .bg-\[\#1e2535\], body.light-theme .bg-\[\#252d3d\], body.light-theme .bg-\[\#282041\], 
        body.light-theme .bg-\[\#2E2447\], body.light-theme .bg-\[\#2a3548\] { background-color: #ffffff !important; }
        body.light-theme .text-white { color: #1f2937 !important; }
        body.light-theme .text-gray-400, body.light-theme .text-gray-500 { color: #6b7280 !important; }
        body.light-theme .border-white\/10, body.light-theme .border-white\/5, body.light-theme .border-white\/\[0\.07\] { border-color: rgba(0, 0, 0, 0.1) !important; }
        body.light-theme .bg-white\/5, body.light-theme .bg-white\/\[0\.04\], body.light-theme .bg-white\/\[0\.06\], body.light-theme .bg-white\/15 { background-color: rgba(0, 0, 0, 0.05) !important; }
        
        /* Transaction Card Styles */
        .transaction-card {
            background-color: rgba(30, 27, 75, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .transaction-card:hover {
            background-color: rgba(124, 58, 237, 0.08);
            border-color: rgba(124, 58, 237, 0.3);
        }
        body.light-theme .transaction-card {
            background-color: #ffffff;
            border-color: #e5e7eb;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        body.light-theme .transaction-card:hover {
            border-color: #7C3AED;
        }
        
        /* Tab Styles */
        .tab-btn { transition: all 0.2s ease; }
        .tab-btn.active { background-color: #7C3AED; color: white; }
        
        /* Loading Spinner */
        .loading-spinner { text-align: center; padding: 40px; color: #7C3AED; font-weight: bold; }
    </style>
</head>
<body class="antialiased text-white min-h-screen flex flex-col">

    <!-- Header -->
    <header class="shrink-0 flex items-center justify-between px-4 py-4 bg-[#1F1936] border-b border-white/10">
        <!-- FIXED: Links back to dashboard.html -->
        <a href="dashboard.html" class="flex items-center gap-2 text-white hover:text-[#A78BFA] transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
            <span class="font-bold">Back to Trade</span>
        </a>
        <div class="flex items-center gap-3">
            <button onclick="toggleSound()" id="sound-toggle" class="p-2 rounded-md bg-[#282041] transition-colors" title="Toggle Sound">
                <svg id="sound-icon-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#7C3AED]"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><path d="M16 9a5 5 0 0 1 0 6"></path><path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path></svg>
                <svg id="sound-icon-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500 hidden"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>
            </button>
            <button onclick="toggleDarkTheme()" class="p-2 rounded-md bg-[#282041] transition-colors" title="Toggle Theme">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#7C3AED]"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 max-w-4xl mx-auto w-full">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white mb-2">Transaction History</h1>
            <p class="text-gray-400 text-sm">View all your deposits, withdrawals, and trading activity.</p>
        </div>

        <!-- Date Range Filter -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-white mb-2">Date Range</label>
            <div class="flex gap-2 flex-wrap">
                <button onclick="filterByDate('all')" class="date-btn active px-4 py-2 rounded-lg text-sm font-medium bg-[#7C3AED] text-white transition-all">All Time</button>
                <button onclick="filterByDate('today')" class="date-btn px-4 py-2 rounded-lg text-sm font-medium bg-[#282041] text-gray-400 hover:bg-[#7C3AED] hover:text-white transition-all">Today</button>
                <button onclick="filterByDate('7days')" class="date-btn px-4 py-2 rounded-lg text-sm font-medium bg-[#282041] text-gray-400 hover:bg-[#7C3AED] hover:text-white transition-all">Last 7 Days</button>
                <button onclick="filterByDate('30days')" class="date-btn px-4 py-2 rounded-lg text-sm font-medium bg-[#282041] text-gray-400 hover:bg-[#7C3AED] hover:text-white transition-all">Last 30 Days</button>
            </div>
        </div>

        <!-- Transaction Type Tabs -->
        <div class="mb-6">
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
                <button onclick="filterByType('all')" class="tab-btn active px-5 py-2.5 rounded-lg text-sm font-semibold whitespace-nowrap">All</button>
                <button onclick="filterByType('deposit')" class="tab-btn px-5 py-2.5 rounded-lg text-sm font-semibold whitespace-nowrap bg-[#282041] text-gray-400 hover:bg-[#7C3AED]/20">Deposits</button>
                <button onclick="filterByType('withdrawal')" class="tab-btn px-5 py-2.5 rounded-lg text-sm font-semibold whitespace-nowrap bg-[#282041] text-gray-400 hover:bg-[#7C3AED]/20">Withdrawals</button>
                <button onclick="filterByType('trade')" class="tab-btn px-5 py-2.5 rounded-lg text-sm font-semibold whitespace-nowrap bg-[#282041] text-gray-400 hover:bg-[#7C3AED]/20">Trades</button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="loading-spinner">Loading transactions...</div>

        <!-- Transaction List -->
        <div id="transaction-list" class="space-y-3"></div>

        <!-- Empty State (Hidden by default) -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16">
            <div class="w-16 h-16 rounded-full bg-[#181329] flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <p class="text-gray-400 text-center">No transactions found for the selected filters.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 text-center text-xs text-gray-500 border-t border-white/5 bg-[#130f1c]">
        <p>&copy; 2026 OBX PRIME. All rights reserved.</p>
    </footer>

    <script>
        // ===== SUPABASE CONFIGURATION =====
        const OBX_SUPABASE_URL = 'https://twvwwpywcmjdrocsfhya.supabase.co';
        const OBX_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8';
        let obxSupabase;
        let currentUser = null;
        let allTransactions = [];

        if (typeof window.supabase !== 'undefined') {
            obxSupabase = window.supabase.createClient(OBX_SUPABASE_URL, OBX_SUPABASE_ANON_KEY);
        }

        // CHECK AUTH & LOAD DATA ON STARTUP
        async function initPage() {
            if (!obxSupabase) return;
            
            const { data: { session } } = await obxSupabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            
            currentUser = session.user;
            await loadTransactions();
        }

        // FETCH REAL TRANSACTIONS FROM SUPABASE
        async function loadTransactions() {
            const listEl = document.getElementById('transaction-list');
            const loadingEl = document.getElementById('loading-state');
            const emptyEl = document.getElementById('empty-state');
            
            try {
                // Fetch Trades
                const { data: trades, error: tradeErr } = await obxSupabase
                    .from('trades')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });
                    
                // Fetch Deposits  
                const { data: deposits, error: depErr } = await obxSupabase
                    .from('deposits')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });
                    
                // Fetch Withdrawals
                const { data: withdrawals, error: withErr } = await obxSupabase
                    .from('withdrawals')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (tradeErr || depErr || withErr) throw new Error("Failed to fetch transactions");

                // Combine and normalize data
                allTransactions = [
                    ...(trades || []).map(t => ({ ...t, type: 'trade' })),
                    ...(deposits || []).map(d => ({ ...d, type: 'deposit' })),
                    ...(withdrawals || []).map(w => ({ ...w, type: 'withdrawal' }))
                ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                renderTransactions(allTransactions);
                
            } catch (err) {
                console.error("Load error:", err);
                listEl.innerHTML = '<p class="text-center text-red-500 py-8">Failed to load transactions. Please try again.</p>';
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        // RENDER TRANSACTION CARDS
        function renderTransactions(transactions) {
            const listEl = document.getElementById('transaction-list');
            const emptyEl = document.getElementById('empty-state');
            
            if (transactions.length === 0) {
                listEl.innerHTML = '';
                emptyEl.classList.remove('hidden');
                return;
            }
            
            emptyEl.classList.add('hidden');
            listEl.innerHTML = transactions.map(t => createTransactionCard(t)).join('');
        }

        // CREATE INDIVIDUAL CARD HTML
        function createTransactionCard(t) {
            const date = new Date(t.created_at);
            const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            let icon, title, amountClass, amountText, statusClass, statusText;
            
            if (t.type === 'trade') {
                const isWin = t.status === 'WON' || (t.pnl && t.pnl > 0);
                icon = isWin 
                    ? `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>`
                    : `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#ff444f]"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>`;
                title = `${t.direction} Trade (${t.asset})`;
                amountClass = isWin ? 'text-emerald-500' : 'text-[#ff444f]';
                amountText = `${isWin ? '+' : '-'}$${Math.abs(t.pnl || t.stake).toFixed(2)}`;
                statusClass = isWin ? 'bg-emerald-500/20 text-emerald-500' : 'bg-[#ff444f]/20 text-[#ff444f]';
                statusText = isWin ? 'Won' : 'Lost';
            } else if (t.type === 'deposit') {
                icon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#7C3AED]"><path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>`;
                title = `Deposit via ${t.currency}`;
                amountClass = 'text-emerald-500';
                amountText = `+$${parseFloat(t.amount).toFixed(2)}`;
                statusClass = t.status === 'CONFIRMED' ? 'bg-emerald-500/20 text-emerald-500' : 
                              t.status === 'FAILED' ? 'bg-[#ff444f]/20 text-[#ff444f]' : 
                              'bg-[#f59e0b]/20 text-[#f59e0b]';
                statusText = t.status.charAt(0) + t.status.slice(1).toLowerCase();
            } else { // withdrawal
                icon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#10B981]"><path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>`;
                title = `Withdrawal to ${t.method?.toUpperCase() || 'Wallet'}`;
                amountClass = 'text-[#ff444f]';
                amountText = `-$${parseFloat(t.amount).toFixed(2)}`;
                statusClass = t.status === 'COMPLETED' ? 'bg-emerald-500/20 text-emerald-500' : 
                              t.status === 'REJECTED' ? 'bg-[#ff444f]/20 text-[#ff444f]' : 
                              'bg-[#f59e0b]/20 text-[#f59e0b]';
                statusText = t.status.charAt(0) + t.status.slice(1).toLowerCase();
            }

            return `
                <div class="transaction-card p-4 rounded-xl" data-type="${t.type}" data-date="${date.toISOString().split('T')[0]}">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-opacity-20 flex items-center justify-center shrink-0" style="background-color: ${t.type === 'trade' ? (amountClass.includes('emerald') ? 'rgba(16,185,129,0.2)' : 'rgba(255,68,79,0.2)') : t.type === 'deposit' ? 'rgba(124,58,237,0.2)' : 'rgba(16,185,129,0.2)'}">
                                ${icon}
                            </div>
                            <div>
                                <div class="text-white font-semibold">${title}</div>
                                <div class="text-gray-400 text-xs">${dateStr} · ${timeStr}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="${amountClass} font-bold text-lg">${amountText}</div>
                            <div class="px-2 py-0.5 rounded-full ${statusClass} text-xs font-semibold inline-block mt-1">${statusText}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // FILTER FUNCTIONS
        let currentTypeFilter = 'all';
        let currentDateFilter = 'all';

        function filterByType(type) {
            currentTypeFilter = type;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.add('bg-[#282041]', 'text-gray-400');
            });
            event.target.classList.add('active');
            event.target.classList.remove('bg-[#282041]', 'text-gray-400');
            applyFilters();
        }

        function filterByDate(range) {
            currentDateFilter = range;
            document.querySelectorAll('.date-btn').forEach(btn => {
                btn.classList.remove('bg-[#7C3AED]', 'text-white', 'active');
                btn.classList.add('bg-[#282041]', 'text-gray-400');
            });
            event.target.classList.add('bg-[#7C3AED]', 'text-white', 'active');
            event.target.classList.remove('bg-[#282041]', 'text-gray-400');
            applyFilters();
        }

        function applyFilters() {
            const cards = document.querySelectorAll('.transaction-card');
            let visibleCount = 0;
            
            cards.forEach(card => {
                const type = card.getAttribute('data-type');
                const date = card.getAttribute('data-date');
                
                let typeMatch = currentTypeFilter === 'all' || type === currentTypeFilter;
                let dateMatch = true;
                
                if (currentDateFilter !== 'all') {
                    const today = new Date();
                    const cardDate = new Date(date);
                    
                    if (currentDateFilter === 'today') {
                        dateMatch = cardDate.toDateString() === today.toDateString();
                    } else if (currentDateFilter === '7days') {
                        const sevenDaysAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
                        dateMatch = cardDate >= sevenDaysAgo;
                    } else if (currentDateFilter === '30days') {
                        const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
                        dateMatch = cardDate >= thirtyDaysAgo;
                    }
                }
                
                if (typeMatch && dateMatch) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            
            document.getElementById('empty-state').classList.toggle('hidden', visibleCount > 0);
        }

        // Theme Toggle
        let isDarkTheme = true;
        function toggleDarkTheme() {
            isDarkTheme = !isDarkTheme;
            document.body.classList.toggle('light-theme', !isDarkTheme);
        }

        // Sound Toggle
        let isSoundOn = true;
        function toggleSound() {
            isSoundOn = !isSoundOn;
            document.getElementById('sound-icon-on').classList.toggle('hidden', !isSoundOn);
            document.getElementById('sound-icon-off').classList.toggle('hidden', isSoundOn);
        }

        // Initialize on load
        window.addEventListener('load', initPage);
    </script>
</body>
</html>
