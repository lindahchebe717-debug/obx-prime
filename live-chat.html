<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBX PRIME | Live Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0b141a; color: #e9edef; font-family: system-ui, sans-serif; }
        body.light-theme { background-color: #efeae2; color: #111b21; }
        
        .chat-bg { 
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); 
            background-color: #0b141a; 
            opacity: 0.06; 
            position: absolute; 
            inset: 0; 
            z-index: 0; 
            pointer-events: none; 
        }
        body.light-theme .chat-bg { background-color: #efeae2; opacity: 0.4; }
        
        .msg-bubble { max-width: 80%; padding: 8px 12px; border-radius: 12px; position: relative; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .msg-sent { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .msg-received { background-color: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        body.light-theme .msg-sent { background-color: #d9fdd3; }
        body.light-theme .msg-received { background-color: #ffffff; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .view-once-blur { filter: blur(15px); transition: filter 0.3s; cursor: pointer; }
        .view-once-blur.revealed { filter: blur(0); }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden"> <!-- ✅ FIXED: 100dvh works better on mobile -->

    <!-- Header -->
    <header class="bg-[#1f2c34] px-4 py-3 flex items-center justify-between z-30 border-b border-black/20 shrink-0">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="text-gray-400 hover:text-white"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></a>
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-600 to-pink-500 flex items-center justify-center font-bold text-white">OBX</div>
            <div>
                <h1 class="font-bold text-[15px] text-white">OBX Support</h1>
                <p class="text-[12px] text-gray-400" id="agent-status">● Online</p>
            </div>
        </div>
        <button onclick="toggleTheme()" class="p-2 text-gray-400"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    </header>

    <!-- Quick Replies (FAQ) -->
    <div id="quick-replies" class="bg-[#111b21] border-b border-black/20 p-3 flex gap-2 overflow-x-auto no-scrollbar z-20 shrink-0">
        <button onclick="sendFaq('trading')" class="whitespace-nowrap px-4 py-1.5 rounded-full bg-[#2a3942] text-[#8696a0] text-sm hover:bg-[#00a884] hover:text-white transition">📈 Trading</button>
        <button onclick="sendFaq('deposit')" class="whitespace-nowrap px-4 py-1.5 rounded-full bg-[#2a3942] text-[#8696a0] text-sm hover:bg-[#00a884] hover:text-white transition">💰 Deposit</button>
        <button onclick="sendFaq('withdraw')" class="whitespace-nowrap px-4 py-1.5 rounded-full bg-[#2a3942] text-[#8696a0] text-sm hover:bg-[#00a884] hover:text-white transition">💸 Withdraw</button>
        <button onclick="sendFaq('refer')" class="whitespace-nowrap px-4 py-1.5 rounded-full bg-[#2a3942] text-[#8696a0] text-sm hover:bg-[#00a884] hover:text-white transition">🎁 Refer</button>
        <button onclick="connectToAgent()" class="whitespace-nowrap px-4 py-1.5 rounded-full bg-[#00a884] text-white text-sm font-bold">👨💼 Live Agent</button>
    </div>

    <!-- Chat Area -->
    <!-- ✅ FIXED: Added pb-24 so messages don't get hidden behind the fixed footer -->
    <main class="flex-1 relative overflow-y-auto p-4 flex flex-col gap-2 z-10 pb-24" id="chat-container">
        <div class="chat-bg"></div>
        <div class="text-center my-4 z-10">
            <span class="bg-[#182229] text-[#8696a0] text-xs px-3 py-1 rounded-lg shadow">Today</span>
        </div>
        <!-- Messages injected here -->
    </main>

    <!-- Reply Preview Bar (Hidden by default) -->
    <div id="reply-bar" class="hidden fixed bottom-20 left-2 right-2 bg-[#111b21] border-l-4 border-[#00a884] p-3 rounded flex justify-between items-center z-40 shadow-lg">
        <div>
            <p class="text-[#00a884] text-xs font-bold mb-1">Replying to...</p>
            <p id="reply-text" class="text-gray-400 text-sm truncate max-w-[250px]"></p>
        </div>
        <button onclick="cancelReply()" class="text-gray-500 hover:text-white"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>

    <!-- ✅ FIXED: Input Area is now fixed to the bottom of the screen -->
    <footer class="fixed bottom-0 left-0 right-0 bg-[#1f2c34] p-2 flex items-center gap-2 z-50 border-t border-black/20 pb-[max(0.5rem,env(safe-area-inset-bottom))]">
        <button onclick="toggleEmoji()" class="p-2 text-gray-400 hover:text-white shrink-0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></button>
        
        <label class="p-2 text-gray-400 hover:text-white cursor-pointer relative shrink-0">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFileSelect(event)">
        </label>

        <div class="flex-1 bg-[#2a3942] rounded-lg flex items-center px-4 py-2 min-w-0">
            <input type="text" id="msg-input" placeholder="Type a message..." class="bg-transparent w-full outline-none text-white placeholder-gray-400 text-sm" onkeypress="handleEnter(event)">
            <button id="view-once-btn" onclick="toggleViewOnce()" class="text-gray-500 hover:text-[#00a884] ml-2 hidden shrink-0">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>

        <button id="send-btn" onclick="sendMessage()" class="p-3 bg-[#00a884] rounded-full text-white hover:bg-[#008f72] transition shrink-0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <button id="mic-btn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()" class="p-3 bg-[#00a884] rounded-full text-white hover:bg-[#008f72] transition hidden shrink-0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
    </footer>

    <!-- Emoji Picker -->
    <div id="emoji-picker" class="hidden fixed bottom-24 left-2 bg-[#1f2c34] border border-black/20 rounded-xl p-3 grid grid-cols-8 gap-2 z-50 shadow-2xl max-h-48 overflow-y-auto"></div>

    <!-- Image Preview Modal -->
    <div id="preview-modal" class="hidden fixed inset-0 bg-black/90 z-[60] flex flex-col items-center justify-center p-4">
        <img id="preview-img" src="" class="max-h-[70vh] rounded-lg mb-4">
        <div class="flex gap-4">
            <button onclick="closePreview()" class="px-6 py-2 bg-gray-700 rounded-full text-white">Cancel</button>
            <button onclick="sendImage()" class="px-6 py-2 bg-[#00a884] rounded-full text-white font-bold">Send</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://twvwwpywcmjdrocsfhya.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentRoomId = null;
        let replyToId = null;
        let isViewOnce = false;
        let selectedFile = null;
        let mediaRecorder = null;
        let audioChunks = [];

        const botResponses = {
            trading: " **Trading:** We offer synthetic indices like Volatility 10, 25, 50, 75, and 100. You can trade Even/Odd, Over/Under, and Matches/Differs. Payouts are up to 95.2%!",
            deposit: "💰 **Deposits:** We exclusively support crypto! You can deposit via BTC, ETH, or USDT (ERC20). Go to Menu > Deposit to get your unique wallet address.",
            withdraw: "💸 **Withdrawals:** Crypto withdrawals are processed within 10-45 minutes depending on network congestion. Minimum withdrawal is $10.",
            refer: "🎁 **Refer & Earn:** Share your unique link! You earn 10% of your referral's net trading losses daily. Commissions are paid out automatically."
        };

        // --- GLOBAL FUNCTIONS ---
        window.sendFaq = async function(type) {
            if (!currentRoomId) { alert("Chat is still initializing, please wait..."); return; }
            await supabaseClient.from('support_messages').insert({
                room_id: currentRoomId, sender_id: currentUser.id, sender_type: 'user',
                content: type.toUpperCase(), type: 'text'
            });
            setTimeout(() => sendBotMessage(botResponses[type]), 800);
        };

        window.connectToAgent = async function() {
            if (!currentRoomId) return;
            await supabaseClient.from('support_messages').insert({
                room_id: currentRoomId, sender_id: currentUser.id, sender_type: 'user',
                content: "👨‍💼 User requested a Live Agent.", type: 'text'
            });
            await supabaseClient.from('support_rooms').update({ status: 'waiting' }).eq('id', currentRoomId);
            document.getElementById('agent-status').innerText = "⏳ Waiting for agent...";
            sendBotMessage("🕒 Please hold on. A live support agent will join this chat shortly.");
        };

        window.toggleTheme = function() { document.body.classList.toggle('light-theme'); };

        window.sendMessage = async function() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentRoomId) return;

            await supabaseClient.from('support_messages').insert({
                room_id: currentRoomId, sender_id: currentUser.id, sender_type: 'user',
                content: text, type: 'text', reply_to_id: replyToId
            });
            input.value = '';
            cancelReply();
            
            const { data: room } = await supabaseClient.from('support_rooms').select('status').eq('id', currentRoomId).single();
            if (room && room.status === 'waiting') {
                setTimeout(() => checkBotTrigger(text), 1000);
            }
        };

        window.handleFileSelect = function(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('preview-img').src = URL.createObjectURL(file);
                document.getElementById('preview-modal').classList.remove('hidden');
                document.getElementById('view-once-btn').classList.remove('hidden');
            }
        };

        window.sendImage = async function() {
            if (!selectedFile || !currentRoomId) return;
            const fileName = `${currentUser.id}/${Date.now()}.${selectedFile.name.split('.').pop()}`;
            const { data, error } = await supabaseClient.storage.from('chat_uploads').upload(fileName, selectedFile);
            if (error) { alert("Upload failed: " + error.message); return; }
            
            const { data: { publicUrl } } = supabaseClient.storage.from('chat_uploads').getPublicUrl(data.path);
            await supabaseClient.from('support_messages').insert({
                room_id: currentRoomId, sender_id: currentUser.id, sender_type: 'user',
                content: publicUrl, type: 'image', view_once: isViewOnce, reply_to_id: replyToId
            });
            closePreview();
        };

        window.startRecording = function() {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.start();
                document.getElementById('send-btn').classList.add('hidden');
                document.getElementById('mic-btn').classList.remove('hidden');
                document.getElementById('mic-btn').classList.add('animate-pulse', 'bg-red-500');
            }).catch(err => alert("Microphone access denied: " + err.message));
        };

        window.stopRecording = async function() {
            if (!mediaRecorder) return;
            mediaRecorder.stop();
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const fileName = `${currentUser.id}/voice_${Date.now()}.webm`;
                const { data } = await supabaseClient.storage.from('chat_uploads').upload(fileName, audioBlob);
                const { data: { publicUrl } } = supabaseClient.storage.from('chat_uploads').getPublicUrl(data.path);

                await supabaseClient.from('support_messages').insert({
                    room_id: currentRoomId, sender_id: currentUser.id, sender_type: 'user',
                    content: publicUrl, type: 'voice'
                });
            };
            document.getElementById('send-btn').classList.remove('hidden');
            document.getElementById('mic-btn').classList.add('hidden');
            document.getElementById('mic-btn').classList.remove('animate-pulse', 'bg-red-500');
        };

        window.toggleEmoji = function() { document.getElementById('emoji-picker').classList.toggle('hidden'); };
        window.closePreview = function() { 
            document.getElementById('preview-modal').classList.add('hidden'); 
            selectedFile = null; isViewOnce = false; 
            document.getElementById('view-once-btn').classList.add('hidden'); 
        };
        window.handleEnter = function(e) { if (e.key === 'Enter') sendMessage(); };
        window.scrollToBottom = function() { const c = document.getElementById('chat-container'); c.scrollTop = c.scrollHeight; };
        window.formatText = function(t) { return t.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); };

        window.showReplyOptions = function(id, text) {
            replyToId = id;
            document.getElementById('reply-text').innerText = text;
            document.getElementById('reply-bar').classList.remove('hidden');
            document.getElementById('msg-input').focus();
        };

        window.cancelReply = function() {
            replyToId = null;
            document.getElementById('reply-bar').classList.add('hidden');
        };

        window.toggleViewOnce = function() {
            isViewOnce = !isViewOnce;
            document.getElementById('view-once-btn').classList.toggle('text-[#00a884]');
        };

        window.revealViewOnce = async function(el, msgId) {
            el.classList.add('revealed');
            await supabaseClient.from('support_messages').update({ is_viewed: true }).eq('id', msgId);
        };

        window.setupEmojis = function() {
            const emojis = ['😀','😂','😍','🥰','','🤔','👍','','🔥','💯','','💰','📈','📉','❤️','🤝','👨💼','⏳','✅',''];
            const picker = document.getElementById('emoji-picker');
            picker.innerHTML = '';
            emojis.forEach(e => {
                const btn = document.createElement('button');
                btn.innerText = e;
                btn.className = 'text-2xl hover:bg-black/20 rounded p-1';
                btn.onclick = () => { document.getElementById('msg-input').value += e; toggleEmoji(); };
                picker.appendChild(btn);
            });
        };

        // --- CORE FUNCTIONS ---
        async function init() {
            try {
                const { data: { user }, error } = await supabaseClient.auth.getUser();
                if (error || !user) { window.location.href = 'signin.html'; return; }
                currentUser = user;
                
                const { data: room, error: roomError } = await supabaseClient.from('support_rooms').select('*').eq('user_id', user.id).neq('status', 'closed').order('created_at', { ascending: false }).limit(1).single();
                
                if (room) {
                    currentRoomId = room.id;
                } else {
                    const { data: newRoom, error: insertError } = await supabaseClient.from('support_rooms').insert({ user_id: user.id, status: 'waiting' }).select().single();
                    if (insertError) { alert("Failed to create chat room."); return; }
                    currentRoomId = newRoom.id;
                    setTimeout(() => sendBotMessage("👋 Welcome to OBX PRIME Support! Tap a quick reply below or ask a question."), 500);
                }

                loadMessages();
                listenForNewMessages();
                setupInputListeners();
                setupEmojis();
            } catch (err) { console.error("Init error:", err); }
        }

        async function loadMessages() {
            const { data, error } = await supabaseClient.from('support_messages').select('*').eq('room_id', currentRoomId).order('created_at', { ascending: true });
            if (error) return;
            
            const container = document.getElementById('chat-container');
            // Keep the background and date, clear messages
            container.innerHTML = '<div class="chat-bg"></div><div class="text-center my-4 z-10"><span class="bg-[#182229] text-[#8696a0] text-xs px-3 py-1 rounded-lg shadow">Today</span></div>';
            
            if (data && data.length > 0) {
                data.forEach(msg => renderMessage(msg));
                scrollToBottom();
            }
        }

        function listenForNewMessages() {
            supabaseClient.channel('room-' + currentRoomId)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'support_messages', filter: `room_id=eq.${currentRoomId}` }, payload => {
                    renderMessage(payload.new);
                    scrollToBottom();
                })
                .subscribe();
        }

        function renderMessage(msg) {
            const container = document.getElementById('chat-container');
            // ✅ FIXED: Bot messages now appear on the LEFT (received), user messages on the RIGHT (sent)
            const isMe = msg.sender_id === currentUser.id && msg.sender_type !== 'bot';
            const div = document.createElement('div');
            div.className = `flex w-full z-10 ${isMe ? 'justify-end' : 'justify-start'} mb-2`;
            
            let contentHtml = '';
            if (msg.type === 'text') {
                contentHtml = `<p class="text-[15px]">${formatText(msg.content)}</p>`;
            } else if (msg.type === 'image') {
                if (msg.view_once && !msg.is_viewed) {
                    contentHtml = `<div class="view-once-blur w-48 h-48 bg-black flex items-center justify-center rounded relative" onclick="revealViewOnce(this, '${msg.id}')"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="absolute text-white text-xs mt-12">View Once</span></div>`;
                } else {
                    contentHtml = `<img src="${msg.content}" class="max-w-[250px] rounded-lg mb-1" oncontextmenu="return false;">`;
                }
            } else if (msg.type === 'voice') {
                contentHtml = `<audio controls src="${msg.content}" class="w-64 h-8"></audio>`;
            }

            div.innerHTML = `
                <div class="msg-bubble ${isMe ? 'msg-sent' : 'msg-received'} group" oncontextmenu="showReplyOptions('${msg.id}', '${msg.content ? msg.content.replace(/'/g, "\\'") : ''}')">
                    ${contentHtml}
                    <div class="text-[10px] text-gray-400 text-right mt-1 flex justify-end gap-1 items-center">
                        ${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                        ${isMe ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#53bdeb" stroke-width="2"><path d="M18 6 7 17l-5-5"/></svg>' : ''}
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        async function sendBotMessage(text) {
            await supabaseClient.from('support_messages').insert({
                room_id: currentRoomId, sender_id: currentUser.id, sender_type: 'bot',
                content: text, type: 'text'
            });
        }

        async function checkBotTrigger(text) {
            const lowerText = text.toLowerCase();
            if (lowerText.includes('deposit') || lowerText.includes('fund')) setTimeout(() => sendBotMessage(botResponses.deposit), 1000);
            else if (lowerText.includes('withdraw') || lowerText.includes('withdrawal')) setTimeout(() => sendBotMessage(botResponses.withdraw), 1000);
            else if (lowerText.includes('refer') || lowerText.includes('affiliate')) setTimeout(() => sendBotMessage(botResponses.refer), 1000);
            else if (lowerText.includes('trade') || lowerText.includes('trading')) setTimeout(() => sendBotMessage(botResponses.trading), 1000);
        }

        function setupInputListeners() {
            const input = document.getElementById('msg-input');
            input.addEventListener('input', (e) => {
                if(e.target.value.trim()) {
                    document.getElementById('send-btn').classList.remove('hidden');
                    document.getElementById('mic-btn').classList.add('hidden');
                } else {
                    document.getElementById('send-btn').classList.add('hidden');
                    document.getElementById('mic-btn').classList.remove('hidden');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
