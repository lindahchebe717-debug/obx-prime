<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBX PRIME | My Positions</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="logo">OBX PRIME</div>
        <div class="nav-links">
            <a href="dashboard.html">Trade</a>
            <a href="#" class="active">Positions</a>
            <a href="#">AI Signals</a>
            <button class="btn-deposit">Deposit</button>
        </div>
    </nav>

    <main class="trade-container" style="display:block;">
        <div class="chart-panel" style="height:auto; min-height:400px;">
            <h2 style="margin-bottom:1.5rem;">Active & Closed Trades</h2>
            <table style="width:100%; border-collapse:collapse; color:var(--text-gray);">
                <thead>
                    <tr style="border-bottom:1px solid var(--border-color); text-align:left;">
                        <th style="padding:1rem;">Asset</th>
                        <th>Type</th>
                        <th>Stake</th>
                        <th>Entry</th>
                        <th>Status</th>
                        <th>P/L</th>
                    </tr>
                </thead>
                <tbody id="tradesTable">
                    <tr><td colspan="6" style="padding:2rem; text-align:center;">Loading trades...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://twvwwpywcmjdrocsfhya.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadTrades() {
            const { data: { user } } = await supabase.auth.getUser();
            if(!user) return window.location.href = 'index.html';

            const { data, error } = await supabase
                .from('trades')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('tradesTable');
            if(error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="padding:2rem; text-align:center;">No trades found. Start trading!</td></tr>';
                return;
            }
            
            tbody.innerHTML = '';
            data.forEach(trade => {
                const plClass = trade.pnl >= 0 ? 'color:var(--success-green)' : 'color:var(--danger-red)';
                tbody.innerHTML += `
                    <tr style="border-bottom:1px solid var(--border-color);">
                        <td style="padding:1rem; color:white;">${trade.asset}</td>
                        <td><span style="background:${trade.direction === 'EVEN' ? 'var(--success-green)' : 'var(--danger-red)'}; padding:4px 8px; border-radius:4px; color:white; font-size:0.8rem;">${trade.direction}</span></td>
                        <td>$${trade.stake}</td>
                        <td>${trade.entry_price.toFixed(2)}</td>
                        <td>${trade.status}</td>
                        <td style="${plClass}; font-weight:600;">${trade.pnl ? '$'+trade.pnl : '-'}</td>
                    </tr>
                `;
            });
        }

        loadTrades();
    </script>
</body>
</html>
