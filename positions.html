<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBX PRIME | Positions</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f0a1f;
            --bg-card: #1a1535;
            --primary-purple: #7c3aed;
            --primary-pink: #ec4899;
            --text-white: #ffffff;
            --text-gray: #9ca3af;
            --success-green: #10b981;
            --danger-red: #ef4444;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-dark);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.4;
            min-height: 100vh;
            padding-bottom: 80px;
            font-size: 13px;
        }
        .app-banner {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-pink));
            padding: 0.5rem 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .app-banner-content { display: flex; align-items: center; gap: 0.5rem; }
        .app-banner-icon { width: 2rem; height: 2rem; background: rgba(255,255,255,0.2); border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; }
        .app-banner-icon svg { width: 1.25rem; height: 1.25rem; color: white; }
        .app-banner-text h4 { font-size: 0.75rem; font-weight: 700; color: white; }
        .app-banner-text p { font-size: 0.65rem; color: rgba(255,255,255,0.85); }
        .app-banner-actions { display: flex; align-items: center; gap: 0.375rem; }
        .app-banner-download { background: white; color: var(--primary-purple); border: none; padding: 0.375rem 0.75rem; border-radius: 0.375rem; font-weight: 700; font-size: 0.7rem; cursor: pointer; }
        .app-banner-close { background: rgba(255,255,255,0.2); border: none; width: 1.5rem; height: 1.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 1rem; }
        .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem; background: var(--bg-card); border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 0.5rem; }
        .menu-btn { background: none; border: none; color: var(--text-white); cursor: pointer; padding: 0.375rem; }
        .logo-btn { width: 2rem; height: 2rem; background: var(--primary-purple); border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.875rem; color: white; }
        .account-selector { display: flex; align-items: center; gap: 0.375rem; background: rgba(124, 58, 237, 0.2); padding: 0.375rem 0.75rem; border-radius: 0.5rem; cursor: pointer; }
        .account-icon { width: 1.5rem; height: 1.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.7rem; }
        .account-icon.real { background: var(--primary-purple); }
        .account-icon.demo { background: var(--danger-red); }
        .account-balance { font-weight: 700; font-size: 0.75rem; }
        .nav-right { display: flex; align-items: center; gap: 0.5rem; }
        .icon-btn { background: none; border: none; color: var(--text-white); cursor: pointer; padding: 0.375rem; width: 2rem; height: 2rem; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; }
        .deposit-btn { background: var(--primary-purple); color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 700; font-size: 0.75rem; cursor: pointer; }
        .tabs { display: flex; background: var(--bg-card); border-bottom: 1px solid var(--border-color); }
        .tab { flex: 1; padding: 0.75rem; text-align: center; cursor: pointer; font-weight: 600; font-size: 0.75rem; color: var(--text-gray); border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab.active { color: var(--primary-purple); border-bottom-color: var(--primary-purple); }
        .positions-content { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; padding: 1.5rem; text-align: center; }
        .empty-icon { width: 80px; height: 80px; background: rgba(124, 58, 237, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; }
        .empty-icon svg { width: 40px; height: 40px; color: var(--text-gray); }
        .empty-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.375rem; }
        .empty-subtitle { font-size: 0.75rem; color: var(--text-gray); }
        .trade-list { width: 100%; padding: 0.75rem; }
        .trade-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 0.5rem; padding: 0.75rem; margin-bottom: 0.5rem; }
        .trade-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .trade-asset { font-weight: 700; font-size: 0.8rem; }
        .trade-direction { font-weight: 700; font-size: 0.75rem; text-transform: uppercase; padding: 0.125rem 0.375rem; border-radius: 0.25rem; background: rgba(255,255,255,0.05); }
        .trade-details { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-gray); margin-bottom: 0.25rem; }
        .trade-mode-badge { display: inline-block; font-size: 0.65rem; color: var(--primary-purple); background: rgba(124, 58, 237, 0.1); padding: 0.125rem 0.375rem; border-radius: 0.25rem; margin-top: 0.25rem; }
        .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; border-bottom: 1px solid var(--border-color); }
        .tx-left { display: flex; flex-direction: column; }
        .tx-title { font-weight: 600; font-size: 0.8rem; }
        .tx-subtitle { font-size: 0.7rem; color: var(--text-gray); margin-top: 0.125rem; }
        .tx-amount { font-weight: 700; font-size: 0.85rem; }
        .tx-amount.negative { color: var(--danger-red); }
        .tx-amount.positive { color: var(--success-green); }
        .tx-amount.neutral { color: var(--text-gray); }
        .session-stats { position: fixed; bottom: 60px; left: 0; right: 0; background: var(--bg-card); border-top: 1px solid var(--border-color); padding: 0.75rem 1rem; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 0.25rem 0; }
        .stat-label { font-size: 0.75rem; color: var(--text-gray); }
        .stat-value { font-size: 0.75rem; font-weight: 600; }
        .stat-value.negative { color: var(--danger-red); }
        .stat-value.positive { color: var(--success-green); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; padding: 0.5rem 0; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 0.125rem; color: var(--text-gray); text-decoration: none; font-size: 0.65rem; font-weight: 600; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary-purple); }
        .nav-icon { width: 1.25rem; height: 1.25rem; }
        .ai-icon-wrap { width: 3rem; height: 3rem; background: linear-gradient(135deg, var(--primary-purple), var(--primary-pink)); border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; margin: -1.25rem 0; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4); }
        .ai-icon { width: 1.5rem; height: 1.5rem; color: white; }
    </style>
</head>
<body>
    <div class="app-banner" id="appBanner">
        <div class="app-banner-content">
            <div class="app-banner-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </div>
            <div class="app-banner-text">
                <h4>Get the OBX PRIME App</h4>
                <p>Get a better trading experience</p>
            </div>
        </div>
        <div class="app-banner-actions">
            <button class="app-banner-download">Download</button>
            <button class="app-banner-close" onclick="document.getElementById('appBanner').style.display='none'">×</button>
        </div>
    </div>

    <nav class="top-nav">
        <div class="nav-left">
            <button class="menu-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
            <div class="logo-btn">P</div>
            <div class="account-selector" id="accountSelector">
                <div class="account-icon" id="navAccountIcon">D</div>
                <span class="account-balance" id="navAccountBalance">$ 10,000.00</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
        </div>
        <div class="nav-right">
            <button class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg></button>
            <button class="deposit-btn" onclick="window.location.href='deposit.html'">Deposit</button>
            <button class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></button>
        </div>
    </nav>

    <div class="tabs">
        <div class="tab active" id="tabOpen" onclick="switchTab('open')">Open (0)</div>
        <div class="tab" id="tabClosed" onclick="switchTab('closed')">Closed (0)</div>
        <div class="tab" id="tabTransactions" onclick="switchTab('transactions')">Transactions</div>
    </div>

    <div class="positions-content" id="positionsContent">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
        </div>
        <h2 class="empty-title">No open positions</h2>
        <p class="empty-subtitle">Your active trades will appear here</p>
    </div>

    <div class="session-stats">
        <div class="stat-row">
            <span class="stat-label">Last Session</span>
            <span class="stat-value" id="sessionStats">0 trades</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Session P/L:</span>
            <span class="stat-value" id="sessionPnl">$0.00</span>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" x2="18" y1="20" y2="10"></line><line x1="12" x2="12" y1="20" y2="4"></line><line x1="6" x2="6" y1="20" y2="14"></line></svg>
            <span>Trade</span>
        </a>
        <a href="ai.html" class="nav-item">
            <div class="ai-icon-wrap"><svg class="ai-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg></div>
            <span>AI</span>
        </a>
        <a href="positions.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span>Positions</span>
        </a>
    </nav>

    <script>
        let currentAccount = localStorage.getItem('obx_account_mode') || 'demo';
        let demoBalance = parseFloat(localStorage.getItem('obx_demo_balance')) || 10000.00;
        let realBalance = 0.00;
        let allTrades = [];
        let currentTab = 'open';

        if (typeof window.obxSupabase === 'undefined' && typeof window.supabase !== 'undefined') {
            window.obxSupabase = window.supabase.createClient(
                'https://twvwwpywcmjdrocsfhya.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dnd3cHl3Y21qZHJvY3NmaHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzI4ODQsImV4cCI6MjEwNTkwODg4NH0.RPCR_K_GwxDJSWnxkjCdd_AxFHXJq3R87cOVDR7FBd8'
            );
        }

        function updateTopNav() {
            const icon = document.getElementById('navAccountIcon');
            const balance = document.getElementById('navAccountBalance');
            if (currentAccount === 'real') {
                icon.className = 'account-icon real';
                icon.innerText = 'R';
                balance.innerText = '$ ' + realBalance.toFixed(2);
            } else {
                icon.className = 'account-icon demo';
                icon.innerText = 'D';
                balance.innerText = '$ ' + demoBalance.toFixed(2);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            renderView();
        }

        function renderView() {
            const content = document.getElementById('positionsContent');
            const sessionStats = document.getElementById('sessionStats');
            const sessionPnl = document.getElementById('sessionPnl');
            const tabOpen = document.getElementById('tabOpen');
            const tabClosed = document.getElementById('tabClosed');

            const openTrades = allTrades.filter(t => t.status === 'OPEN');
            const closedTrades = allTrades.filter(t => t.status === 'CLOSED' || t.status === 'WON' || t.status === 'LOST');

            tabOpen.innerText = 'Open (' + openTrades.length + ')';
            tabClosed.innerText = 'Closed (' + closedTrades.length + ')';

            if (currentTab === 'open') {
                if (openTrades.length === 0) {
                    sessionStats.innerText = '0 trades';
                    sessionPnl.innerText = '$0.00';
                    sessionPnl.className = 'stat-value';
                    content.innerHTML = '<div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg></div><h2 class="empty-title">No open positions</h2><p class="empty-subtitle">Your active trades will appear here</p>';
                } else {
                    let totalStake = openTrades.reduce(function(sum, t) { return sum + parseFloat(t.stake || 0); }, 0);
                    sessionStats.innerText = openTrades.length + ' trades';
                    sessionPnl.innerText = '-$' + totalStake.toFixed(2);
                    sessionPnl.className = 'stat-value negative';
                    
                    let html = '<div class="trade-list">';
                    openTrades.forEach(function(t) {
                        const dirColor = (t.direction || '').toUpperCase() === 'EVEN' ? 'var(--success-green)' : 'var(--danger-red)';
                        html += '<div class="trade-card"><div class="trade-card-header"><span class="trade-asset">' + (t.asset || 'VOL_10') + '</span><span class="trade-direction" style="color: ' + dirColor + '">' + (t.direction || 'EVEN') + '</span></div><div class="trade-details"><span>Stake</span><span>$' + parseFloat(t.stake || 0).toFixed(2) + '</span></div><div class="trade-details"><span>Entry</span><span>' + parseFloat(t.entry_price || 0).toFixed(2) + '</span></div><span class="trade-mode-badge">' + (t.mode || 'Manual') + '</span></div>';
                    });
                    html += '</div>';
                    content.innerHTML = html;
                }
            } else if (currentTab === 'closed') {
                if (closedTrades.length === 0) {
                    sessionStats.innerText = '0 trades';
                    sessionPnl.innerText = '$0.00';
                    sessionPnl.className = 'stat-value';
                    content.innerHTML = '<div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path></svg></div><h2 class="empty-title">No closed positions</h2><p class="empty-subtitle">Your completed trades will appear here</p>';
                } else {
                    let totalPnl = closedTrades.reduce(function(sum, t) {
                        if (t.status === 'WON') return sum + (parseFloat(t.payout || 0) - parseFloat(t.stake || 0));
                        return sum - parseFloat(t.stake || 0);
                    }, 0);
                    
                    sessionStats.innerText = closedTrades.length + ' trades';
                    sessionPnl.innerText = (totalPnl >= 0 ? '+$' : '-$') + Math.abs(totalPnl).toFixed(2);
                    sessionPnl.className = 'stat-value ' + (totalPnl >= 0 ? 'positive' : 'negative');

                    let html = '<div class="trade-list">';
                    closedTrades.forEach(function(t) {
                        const isWin = t.status === 'WON';
                        const dirColor = (t.direction || '').toUpperCase() === 'EVEN' ? 'var(--success-green)' : 'var(--danger-red)';
                        const pnlText = isWin ? '+$' + (parseFloat(t.payout || 0) - parseFloat(t.stake || 0)).toFixed(2) : '-$' + parseFloat(t.stake || 0).toFixed(2);
                        const pnlColor = isWin ? 'var(--success-green)' : 'var(--danger-red)';
                        
                        html += '<div class="trade-card"><div class="trade-card-header"><span class="trade-asset">' + (t.asset || 'VOL_10') + '</span><span class="trade-direction" style="color: ' + dirColor + '">' + (t.direction || 'EVEN') + '</span></div><div class="trade-details"><span>Stake</span><span>$' + parseFloat(t.stake || 0).toFixed(2) + '</span></div><div class="trade-details"><span>Payout</span><span style="color: ' + pnlColor + '; font-weight: 700;">' + pnlText + '</span></div><span class="trade-mode-badge">' + (t.mode || 'Manual') + '</span></div>';
                    });
                    html += '</div>';
                    content.innerHTML = html;
                }
            } else if (currentTab === 'transactions') {
                if (allTrades.length === 0) {
                    sessionStats.innerText = '0 transactions';
                    sessionPnl.innerText = '$0.00';
                    sessionPnl.className = 'stat-value';
                    content.innerHTML = '<div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg></div><h2 class="empty-title">No transactions</h2><p class="empty-subtitle">Your transaction history will appear here</p>';
                } else {
                    let txs = [];
                    allTrades.forEach(function(t) {
                        txs.push({ type: 'Stake', subtitle: (t.asset || 'VOL_10') + ' • ' + (t.direction || 'EVEN'), amount: -parseFloat(t.stake || 0), time: t.created_at });
                        if (t.status === 'WON') {
                            txs.push({ type: 'Payout', subtitle: (t.asset || 'VOL_10') + ' • ' + (t.direction || 'EVEN'), amount: parseFloat(t.payout || 0), time: t.created_at });
                        } else if (t.status === 'LOST' || t.status === 'CLOSED') {
                            txs.push({ type: 'Closed', subtitle: (t.asset || 'VOL_10') + ' • ' + (t.direction || 'EVEN'), amount: 0, time: t.created_at });
                        }
                    });
                    txs.sort(function(a, b) { return new Date(b.time) - new Date(a.time); });

                    let html = '<div style="width: 100%;">';
                    txs.forEach(function(tx) {
                        const amountClass = tx.amount > 0 ? 'positive' : (tx.amount < 0 ? 'negative' : 'neutral');
                        const amountText = tx.amount > 0 ? '+$' + tx.amount.toFixed(2) : (tx.amount < 0 ? '-$' + Math.abs(tx.amount).toFixed(2) : '$0.00');
                        const dateStr = tx.time ? new Date(tx.time).toLocaleDateString() : 'Today';
                        
                        html += '<div class="transaction-item"><div class="tx-left"><span class="tx-title">' + tx.type + '</span><span class="tx-subtitle">' + tx.subtitle + ' • ' + dateStr + '</span></div><span class="tx-amount ' + amountClass + '">' + amountText + '</span></div>';
                    });
                    html += '</div>';
                    content.innerHTML = html;
                }
            }
        }

        async function loadPositions() {
            updateTopNav();
            if (!window.obxSupabase) return;
            try {
                const { data: { user } } = await window.obxSupabase.auth.getUser();
                if (!user) return;

                const { data: trades, error } = await window.obxSupabase
                    .from('trades')
                    .select('*')
                    .eq('user_id', user.id)
                    .eq('account_type', currentAccount)
                    .order('created_at', { ascending: false });

                if (!error && trades) {
                    allTrades = trades;
                }
                renderView();
            } catch (e) {
                console.error('Error loading positions:', e);
            }
        }

        loadPositions();
    </script>
</body>
</html>
