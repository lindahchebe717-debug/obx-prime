<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBX PRIME | Positions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #141021; color: white; font-family: system-ui, -apple-system, sans-serif; }

        body.light-theme .text-gray-500 { color: #9ca3af !important; }

<body class="antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="shrink-0 flex items-center justify-between px-4 py-4 bg-[#1F1936] border-b border-white/10 z-40">

        <h1 class="text-lg font-bold text-white">Positions</h1>
        <div class="w-6"></div> <!-- Spacer for balance -->
    </header>

    <!-- Tabs -->
    <div class="flex border-b border-white/10 bg-[#141021]">
        <button class="flex-1 py-3 text-sm font-semibold text-[#7C3AED] border-b-2 border-[#7C3AED]">Open (0)</button>
        <button class="flex-1 py-3 text-sm font-medium text-gray-500 hover:text-white transition-colors">Closed (0)</button>
        <button class="flex-1 py-3 text-sm font-medium text-gray-500 hover:text-white transition-colors">Transactions</button>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 text-center">
        <!-- Empty State Icon -->
        <div class="w-24 h-24 rounded-full bg-[#1e1b4b] flex items-center justify-center mb-6 shadow-inner">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </div>
        
        <h2 class="text-xl font-bold text-white mb-2">No open positions</h2>
        <p class="text-gray-400 text-sm max-w-xs">Your active trades will appear here</p>
    </main>

    <!-- Session Stats Footer -->
    <div class="bg-[#1e1b4b] border-t border-white/10 p-4 pb-24">
        <div class="flex items-center justify-between mb-1">
            <span class="text-gray-400 text-sm">Last Session</span>
            <span class="text-gray-300 text-sm font-medium">9 trades (6W / 3L)</span>
        </div>
        <div class="flex items-center justify-between">
            <span class="text-gray-400 text-sm">Session P/L:</span>
            <span class="text-[#10B981] text-lg font-bold">+46.16 USD</span>
        </div>
    </div>

    <!-- Bottom Navigation (Matches Screenshot Exactly) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#141021] border-t border-white/10 grid grid-cols-3 pb-safe z-50">
        <!-- Trade Tab -->
        <a href="index.html" class="flex flex-col items-center justify-center py-3 text-gray-500 hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="18" y1="20" y2="10"></line><line x1="12" x2="12" y1="20" y2="4"></line><line x1="6" x2="6" y1="20" y2="14"></line></svg>
            <span class="text-[10px] mt-1 font-medium">Trade</span>
        </a>
        
        <!-- AI Tab (Center Highlighted) -->
        <a href="#" class="flex flex-col items-center justify-center py-2 relative group cursor-pointer">
            <div class="relative w-12 h-12 -mt-6 rounded-2xl flex items-center justify-center shadow-lg transform transition-transform active:scale-95" style="background: linear-gradient(135deg, rgb(245, 158, 11) 0%, rgb(236, 72, 153) 55%, rgb(139, 92, 246) 100%); box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="drop-shadow-md"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path><path d="M4 17v2"></path><path d="M5 18H3"></path></svg>
            </div>
            <span class="text-[10px] mt-1 font-bold bg-clip-text text-transparent" style="background-image: linear-gradient(135deg, rgb(245, 158, 11), rgb(236, 72, 153), rgb(139, 92, 246));">AI</span>

        <!-- Positions Tab (Active) -->
        <a href="positions.html" class="flex flex-col items-center justify-center py-3 text-[#7C3AED]">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span class="text-[10px] mt-1 font-medium">Positions</span>
        </a>
    </nav>

    <script>
        // Simple Theme Toggle Logic (Optional)
        if (localStorage.getItem('obx_theme') === 'light') {
            document.body.classList.add('light-theme');
        }

</html>
